    const row = b => { const vs=DATA.filter(v=>v.bai===b), known=vs.filter(v=>stats[v.id]&&stats[v.id].c>0).length;
      return `<div class="mm-item ${b===mapBai?'on':''}"><label class="mm-tick" title="Chọn để ôn"><input type="checkbox" data-mm-tick="${b}" ${prefs.groups.includes(String(b))?'checked':''}></label>
        <button class="mm-name" data-mm-bai="${b}"><i>${b}</i><span>${esc(lname(b))} <small>${vs.length}</small></span><em><b style="width:${known/vs.length*100}%"></b></em></button></div>`; };
    P.innerHTML = `<h2>Mục lục · sơ đồ tư duy</h2><p class="sub">Chọn nhóm ở mục lục để xem sơ đồ; tick các nhóm muốn ôn rồi bấm “Ôn các nhóm đã chọn”. Bấm vào một mẫu để xem cấu trúc và câu ví dụ.</p>
      <div class="mm-layout">
        <aside class="mm-toc">
          <div class="mm-blocks">${BLOCKS.map(bl=>`<button class="mm-tab ${bl===cur?'on':''}" data-mm-bai="${bl.g[0]}"><i class="jp">${bl.ja}</i>${esc(bl.n)}</button>`).join('')}</div>
          ${BLOCKS.map(bl=>`<section class="mm-blk ${bl===cur?'on':''}"><h3><span class="jp">${bl.ja}</span>${esc(bl.n)}</h3>${bl.g.map(row).join('')}</section>`).join('')}
          <div class="mm-toc-foot"><button class="btn" data-mm-ticked ${ticked.length?'':'disabled'}>Ôn các nhóm đã chọn${ticked.length?` (${ticked.length})`:''}</button></div>
        </aside>
        <div class="mm-main">
          ${G[mapBai]?`<div class="mm-head"><b>${esc(G[mapBai].n)}</b> <span class="jp">${esc(G[mapBai].ja||'')}</span>${G[mapBai].d?`<p>${esc(G[mapBai].d)}</p>`:''}</div>`:''}
          <div class="mm"><div class="mm-root"><span>NHÓM</span><b>${mapBai}</b></div>
            <ol class="mm-list">${items.map((v,i)=>`<li class="mm-row c${i%6} ${open===v.id?'open':''}">
              <button class="mm-node" data-mm="${v.id}" aria-expanded="${open===v.id}"><span class="mm-n">${String(v.n).padStart(2,'0')}</span><span class="mm-p jp">${esc(v.p)}</span><span class="mm-m">${esc(v.m)}</span></button>
              ${open===v.id?`<div class="mm-detail">${v.ex.length?`<div class="mm-tools">${rubyBtn()}</div>`:''}${noteHTML(v,false)}${v.ex.map(exLine).join('')||'<p class="mm-note">Chưa có câu ví dụ.</p>'}</div>`:''}</li>`).join('')}</ol></div>
          <div class="row mm-go"><button class="btn" data-mm-go="${mapBai}">Ôn nhóm này · ${items.length} mẫu</button></div>
        </div>
      </div>`;
    { const on=P.querySelector('.mm-blocks .on'), bar=on&&on.parentNode; if(on && bar.scrollWidth>bar.clientWidth) bar.scrollLeft = on.offsetLeft - bar.offsetLeft - (bar.clientWidth - on.offsetWidth)/2; }
    const start = gs => { prefs.groups=gs.map(String); renderSetup(); startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode)); };
    P.onchange = e => { const t=e.target.closest('[data-mm-tick]'); if(!t) return; const g=t.dataset.mmTick;
      prefs.groups = t.checked ? [...new Set([...prefs.groups,g])] : prefs.groups.filter(x=>x!==g); renderSetup(); };
    P.onclick = e => {
      const b=e.target.closest('[data-mm],[data-mm-bai],[data-mm-go],[data-mm-ticked]'); if(!b) return;
      if(b.dataset.mmBai){ mapBai=+b.dataset.mmBai; open=null; store.set('n2map',mapBai); MODULES['grammar-n2'].renderMap(); }
      else if(b.dataset.mm){ open = open===b.dataset.mm ? null : b.dataset.mm; MODULES['grammar-n2'].renderMap(); }
      else if(b.dataset.mmGo){ start([b.dataset.mmGo]); }
      else if(b.dataset.mmTicked!==undefined){ start(ticked); }
    };
  };
}
/* ===================== shared engine ===================== */
const N_Q = 20;
const MODES = [{k:'weak',label:'Ưu tiên câu yếu'},{k:'rand',label:'Ngẫu nhiên'},{k:'order',label:'Theo thứ tự'}];

const store = {
  get(k,d){ try{ const v=localStorage.getItem('bjtvocab:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bjtvocab:'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pickN = (list, n, exclude) => { const seen=new Set(exclude); const out=[]; for(const x of shuffle(list)){ if(out.length>=n) break; if(!x||seen.has(x)) continue; seen.add(x); out.push(x);} return out; };

// nút ルビ: bật/tắt furigana trên câu ví dụ, nhớ lựa chọn cho mọi trang (lớp noruby đặt sớm trong shell.html)
const rubyOn = () => !document.documentElement.classList.contains('noruby');
const rubyBtn = () => `<button class="rubybtn ${rubyOn()?'on':''}" data-ruby aria-pressed="${rubyOn()}" title="Bật/tắt furigana">ルビ</button>`;
const M = MODULES[MODULE];
const ITEMS = M.items;
const byId = Object.fromEntries(ITEMS.map(v=>[v.id,v]));
let stats = store.get('stats', {});
let prefs = Object.assign({groups:M.defaultGroups||[M.groups[0].k], types:M.types.map(t=>t.k), mode:'weak', instant:true, order:{}},
                          store.get('prefs:'+M.key, {}));
prefs.groups = prefs.groups.filter(g=>M.groups.some(x=>x.k===g));
// ?nhom=N (e.g. from the listening page) preselects one lesson/group
{ const g=new URLSearchParams(location.search).get('nhom'); if(g && M.groups.some(x=>x.k===g)) prefs.groups=[g]; }
// modules with sets (vocab: 2200 / 600): one set is shown at a time, and only its groups stay selected
if(M.sets){ const open=M.sets.filter(s=>s.count); if(!open.some(s=>s.k===prefs.set)) prefs.set=open[0].k;
  const g0=prefs.groups.find(g=>M.setOfGroup(g)); if(g0) prefs.set=M.setOfGroup(g0);
  prefs.groups=prefs.groups.filter(g=>M.setOfGroup(g)===prefs.set); if(!prefs.groups.length) prefs.groups=[M.groups.find(g=>g.set===prefs.set).k]; }
prefs.types = prefs.types.filter(t=>M.types.some(x=>x.k===t));
if(!prefs.types.length) prefs.types=M.types.map(t=>t.k);
const savePrefs = () => store.set('prefs:'+M.key, prefs);

/* ---------- audio: pre-recorded Tokyo voice (ja-JP-NanamiNeural) in audio/, browser voice as fallback ---------- */
const player = new Audio();
function speakTTS(text){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
}
function say(text, key){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(!key){ speakTTS(text); return; }
  player.onerror=()=>speakTTS(text);
  player.src='audio/'+key+'.mp3';
  player.play().catch(err=>{ if(err.name!=='AbortError' && err.name!=='NotAllowedError') speakTTS(text); });
}
const spk = (text, key) => `<button class="speak" data-say="${esc(text)}"${key?` data-audio="${esc(key)}"`:''} title="Nghe">🔊</button>`;

/* ---------- session ---------- */
let S=null, timerId=null;
const poolFor = groups => ITEMS.filter(v=>groups.includes(M.groupOf(v)));
function chooseItems(pool, types, mode){
  const usable=pool.filter(v=>types.some(t=>M.canDo(t,v)));
  if(mode==='order'){
    const key=prefs.groups.slice().sort().join(',');
    let start=(prefs.order&&prefs.order[key])||0;
    if(start>=usable.length) start=0;
    const pick=usable.slice(start,start+N_Q);
    if(pick.length<N_Q) pick.push(...usable.slice(0,Math.min(N_Q,usable.length)-pick.length));
    prefs.order=prefs.order||{}; prefs.order[key]=start+N_Q>=usable.length?0:start+N_Q; savePrefs();
    return pick;
  }
  if(mode==='weak'){
    const score=v=>{ const s=stats[v.id]; if(!s) return 1000+Math.random()*100;
      const days=(Date.now()-(s.t||0))/864e5;
      return s.w*40 - s.c*15 + Math.min(days,30)*2 + Math.random()*25; };
    return usable.map(v=>[score(v),v]).sort((a,b)=>b[0]-a[0]).slice(0,N_Q).map(x=>x[1]);
  }
  return shuffle(usable).slice(0,N_Q);
}
function startSession(items){
  const pool=poolFor(prefs.groups);
  const types=prefs.types;
  const qs=shuffle(items).map((v,i)=>{
    const ok=types.filter(t=>M.canDo(t,v));
    const pref=types[i%types.length];
    const t= ok.includes(pref) ? pref : ok[Math.random()*ok.length|0];
    return Object.assign(M.build(t,v,pool), {type:t, id:v.id});
  });
  S={qs, ans:Array(qs.length).fill(null), cur:0, start:Date.now(), done:false, instant:prefs.instant};
  show('quiz'); render();
  clearInterval(timerId); timerId=setInterval(tick,1000); tick();
}
function tick(){
  if(!S) return;
  const sec=Math.floor(((S.end||Date.now())-S.start)/1000);
  $('#timer').textContent=String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
const locked = i => S.done || (S.instant && S.ans[i]!==null);
const typeOf = k => M.types.find(t=>t.k===k);
const LETTERS='ABCD';
function render(){
  const q=S.qs[S.cur], i=S.cur, n=S.qs.length;
  const state = k => S.ans[k]===null ? '' : locked(k) ? (S.qs[k].options[S.ans[k]].ok?'ok':'bad') : 'ans';
  $('#nav').innerHTML=S.qs.map((qq,k)=>`<button class="sq ${state(k)} ${k===i?'cur':''}" data-go="${k}">${k+1}</button>`).join('');
  { const nav=$('#nav'), sq=nav.children[i]; if(sq && nav.scrollWidth>nav.clientWidth) nav.scrollLeft = sq.offsetLeft - nav.offsetLeft - nav.clientWidth/2 + sq.offsetWidth/2; }
  $('#seg').innerHTML=S.qs.map((qq,k)=>`<i class="${state(k)} ${k===i?'cur':''}"></i>`).join('');
  $('#posNum').textContent=i+1; $('#posTotal').textContent=n;
  const done=S.qs.map((qq,k)=>state(k));
  $('#mOk').textContent=done.filter(x=>x==='ok').length;
  $('#mBad').textContent=done.filter(x=>x==='bad').length;
  $('#qn').textContent=`#${i+1}`;
  $('#qtype').textContent=typeOf(q.type).label;
  $('#ask').textContent=q.ask;
  const lk=locked(i);
  $('#stem').innerHTML=q.stem;
  // short options (readings, words) sit in a 2x2 grid; sentences and Vietnamese meanings stay in a list
  const short = !(q.optClass||'').match(/vi|long/) && q.options.every(o=>o.t.length<=14);
  $('#opts').className = 'opts' + (short?' grid2':'');
  $('#opts').innerHTML=q.options.map((o,k)=>{
    let c='opt';
    if(lk){ if(o.ok) c+=' ok'; else if(S.ans[i]===k) c+=' bad'; }
    else if(S.ans[i]===k) c+=' sel';
    return `<button class="${c}" data-opt="${k}" ${lk?'disabled':''}><span class="n">${LETTERS[k]}</span><span class="t ${q.optClass||'jp'}">${esc(o.t)}</span></button>`;
  }).join('');
  const right = S.ans[i]!==null && q.options[S.ans[i]].ok;
  const ex = lk ? M.explain(q, byId[q.id], right) : '';
  $('#explain').innerHTML = lk ? ex.replace(/^(<div class="explain[^>]*>)/, `$1<div class="verdict"><span>${S.ans[i]===null?'Chưa trả lời':right?'✓ Chính xác':'✗ Chưa đúng'}</span>${ex.includes('<ruby>')?rubyBtn():''}</div>`) : '';
  $('#prevBtn').disabled = i===0;
  const last = i===n-1;
  $('#nextBtn').textContent = S.done ? (last?'Xem kết quả':'Câu tiếp →') : (last?'Nộp bài':'Câu tiếp →');
  $('#submitBtn').classList.toggle('hidden', S.done);
}
function choose(k){
  const i=S.cur; if(locked(i) || k>=S.qs[i].options.length) return;
  S.ans[i]=k;
  if(S.instant) record(S.qs[i], k);
  render();
}
function record(q,k){
  const s=stats[q.id]||{c:0,w:0,t:0};
  if(q.options[k].ok) s.c++; else s.w++;
  s.t=Date.now(); stats[q.id]=s; store.set('stats',stats);
}
function go(i){ if(!S||i<0||i>=S.qs.length) return; S.cur=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function next(){
  if(S.cur<S.qs.length-1) return go(S.cur+1);
  if(S.done) return showResult();
  const blank=S.ans.filter(a=>a===null).length;
  if(blank && !confirm(`Còn ${blank} câu chưa trả lời. Nộp bài luôn?`)) return;
  finish();
}
function submitNow(){
  const blank=S.ans.filter(a=>a===null).length;
  if(!confirm(blank?`Còn ${blank} câu chưa trả lời. Nộp bài luôn?`:'Nộp bài?')) return;
  finish();
}
function finish(){
  if(!S.instant) S.qs.forEach((q,i)=>{ if(S.ans[i]!==null) record(q,S.ans[i]); });
  S.done=true; S.end=Date.now(); clearInterval(timerId); tick();
  showResult();
}
let rFilter='all';
function showResult(){
  show('result');
  const total=S.qs.length, ok=S.qs.filter((q,i)=>S.ans[i]!==null&&q.options[S.ans[i]].ok).length;
  const pct=Math.round(ok/total*100);
  const sec=Math.floor((S.end-S.start)/1000);
  $('#scoreBox').innerHTML=`
    <div class="bignum">${ok}<small> / ${total}</small></div>
    <div><h2>${pct>=80?'Tuyệt vời!':pct>=50?'Khá ổn!':'Cố gắng thêm nhé!'}</h2>
    <p>Đúng ${pct}% · Thời gian ${sec/60|0} phút ${sec%60} giây</p>
    <div class="scorebar"><i style="width:${pct}%"></i></div>
    <p style="font-size:12.5px;color:var(--muted)">Bấm vào từng câu bên dưới để xem lại.</p></div>`;
  $('#retryWrong').disabled = ok===total;
  $('#rfilters').innerHTML=[['all','Tất cả'],['bad','Câu sai'],['ok','Câu đúng']].map(([k,l])=>`<button class="pill ${rFilter===k?'on':''}" data-rf="${k}">${l}</button>`).join('');
  $('#rlist').innerHTML=S.qs.map((q,i)=>{
    const v=byId[q.id]; const a=S.ans[i]; const good=a!==null&&q.options[a].ok;
    if(rFilter==='bad'&&good) return ''; if(rFilter==='ok'&&!good) return '';
    const sm=M.summary(v);
    return `<div class="ritem" data-review="${i}"><span class="mk ${good?'ok':'bad'}">${good?'✓':'✗'}</span>
      <div><div class="w jp">${sm.title}</div>
      <div class="m">${sm.sub} · <span style="color:var(--muted)">${typeOf(q.type).name}</span></div>
      ${good?'':`<div class="yours">Bạn chọn: ${a===null?'(bỏ trống)':esc(q.options[a].t)} → Đáp án: ${esc(q.options.find(o=>o.ok).t)}</div>`}</div></div>`;
  }).join('') || '<p class="stat">Không có câu nào.</p>';
}

/* ---------- setup ---------- */
function show(id){
  ['setup','quiz','result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));
  $('#backLbl').textContent = id==='setup' ? 'Trang chủ' : id==='quiz' ? 'Thoát' : 'Chọn lại';
  $('#title').textContent = id==='setup'?M.title:id==='quiz'?M.quizTitle:'Kết quả';
  window.scrollTo(0,0);
}
function renderSetup(){
  if(M.renderMap) M.renderMap();
  $('#lessons').closest('.panel').classList.toggle('hidden', !!M.groupsInMap);
  const set = M.sets && M.sets.find(s=>s.k===prefs.set);
  if(set) $('#sets').innerHTML=M.sets.map(s=>s.count
    ? `<button class="stab ${s.k===set.k?'on':''}" data-set="${s.k}">${s.label}<small>${s.note||s.count+' từ'}</small></button>`
    : `<button class="stab soon" disabled>${s.label}<small>更新中</small></button>`).join('');
  $('#sets').classList.toggle('hidden', !set);
  const on = $('#sets .stab.on'); if(on) on.parentNode.scrollLeft = on.offsetLeft - on.parentNode.offsetLeft - (on.parentNode.clientWidth - on.offsetWidth)/2;
  $('#groupTitle').textContent=M.groupTitle;
  $('#groupSub').textContent=set ? set.sub : M.groupSub;
  $('#quick').innerHTML=M.quick.concat(set ? set.quick : []).map(([k,l])=>`<button class="mini" data-sel="${k}">${l}</button>`).join('');
  $('#lessons').className = M.wideGroups ? 'lessons wide' : 'lessons';
  $('#lessons').innerHTML=M.groups.filter(g=>!set || g.set===set.k).map(g=>{
    const ws=ITEMS.filter(v=>M.groupOf(v)===g.k); const known=ws.filter(v=>stats[v.id]&&stats[v.id].c>0).length;
    return `<button class="lchip ${prefs.groups.includes(g.k)?'on':''}" data-l="${g.k}"><b>${g.label}</b><small>${known}/${ws.length}</small><div class="bar"><i style="width:${known/ws.length*100}%"></i></div></button>`;
  }).join('');
  $('#types').innerHTML=M.types.map(t=>`<button class="tcard ${prefs.types.includes(t.k)?'on':''}" data-t="${t.k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
  $('#modes').innerHTML=MODES.map(m=>`<button class="pill ${prefs.mode===m.k?'on':''}" data-m="${m.k}">${m.label}</button>`).join('');
  $('#instant').checked=prefs.instant;
  const pool=poolFor(prefs.groups).filter(v=>prefs.types.some(t=>M.canDo(t,v)));
  const seen=pool.filter(v=>stats[v.id]).length, weak=pool.filter(v=>stats[v.id]&&stats[v.id].w>stats[v.id].c).length;
  $('#poolStat').innerHTML=`<b>${pool.length}</b> ${M.unit} · đã ôn <b>${seen}</b> · hay sai <b>${weak}</b>`;
  $('#startBtn').textContent=`Bắt đầu ${Math.min(N_Q,pool.length)} câu`;
  $('#startBtn').disabled = pool.length<1 || !prefs.types.length;
  savePrefs();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-review]'); if(!t) return;
  const d=t.dataset;
  if(d.l!==undefined){ const l=d.l; prefs.groups=prefs.groups.includes(l)?prefs.groups.filter(x=>x!==l):[...prefs.groups,l]; renderSetup(); }
  else if(d.sel){ prefs.groups = M.select(d.sel, prefs.set); renderSetup(); }
  else if(d.set){ if(d.set!==prefs.set){ prefs.set=d.set; prefs.groups=[M.groups.find(g=>g.set===d.set).k]; } renderSetup(); }
  else if(d.t){ prefs.types=prefs.types.includes(d.t)?prefs.types.filter(x=>x!==d.t):[...prefs.types,d.t]; renderSetup(); }
  else if(d.m){ prefs.mode=d.m; renderSetup(); }
  else if(d.go!==undefined){ go(+d.go); }
  else if(d.opt!==undefined){ choose(+d.opt); }
  else if(d.say){ say(d.say, d.audio); }
  else if(d.ruby!==undefined){ document.documentElement.classList.toggle('noruby'); store.set('ruby',rubyOn());
    document.querySelectorAll('[data-ruby]').forEach(b=>{ b.classList.toggle('on',rubyOn()); b.setAttribute('aria-pressed',rubyOn()); }); }
  else if(d.reveal!==undefined){ document.querySelectorAll('#stem .tr').forEach(x=>x.classList.remove('hidden')); t.remove(); }
  else if(d.rf){ rFilter=d.rf; showResult(); }
  else if(d.review!==undefined){ show('quiz'); go(+d.review); }
});
$('#instant').addEventListener('change',e=>{ prefs.instant=e.target.checked; savePrefs(); });
$('#startBtn').onclick=()=>startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode));
$('#prevBtn').onclick=()=>go(S.cur-1);
$('#nextBtn').onclick=next;
$('#submitBtn').onclick=submitNow;
// question strip (phone layout): mouse wheel scrolls it sideways, and it can be dragged with the mouse
{ const nav=$('#nav'); let drag=null;
  nav.addEventListener('wheel',e=>{ if(nav.scrollWidth<=nav.clientWidth || Math.abs(e.deltaX)>Math.abs(e.deltaY)) return; nav.scrollLeft+=e.deltaY; e.preventDefault(); },{passive:false});
  nav.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||nav.scrollWidth<=nav.clientWidth) return; drag={x:e.clientX,left:nav.scrollLeft,moved:false}; });
  window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>4){ drag.moved=true; nav.classList.add('dragging'); } nav.scrollLeft=drag.left-dx; });
  // swallow only the click that ends a drag; drop the guard right after in case that click never fires
  const swallow=e=>{ e.stopPropagation(); e.preventDefault(); };
  window.addEventListener('pointerup',()=>{ if(drag&&drag.moved){ nav.addEventListener('click',swallow,{capture:true,once:true}); setTimeout(()=>nav.removeEventListener('click',swallow,{capture:true}),0); } drag=null; nav.classList.remove('dragging'); });
}
$('#newRound').onclick=()=>{ rFilter='all'; startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode)); };
$('#retryWrong').onclick=()=>{ rFilter='all'; startSession(S.qs.filter((q,i)=>!(S.ans[i]!==null&&q.options[S.ans[i]].ok)).map(q=>byId[q.id])); };
$('#toSetup').onclick=()=>{ renderSetup(); show('setup'); };
$('#backBtn').onclick=()=>{
  if(!$('#setup').classList.contains('hidden')){ location.href='index.html'; return; }
  if(!$('#quiz').classList.contains('hidden') && S && !S.done && S.ans.some(a=>a!==null) && !confirm('Thoát bài đang làm?')) return;
  clearInterval(timerId); renderSetup(); show('setup');
};
$('#resetBtn').onclick=()=>{
  if(!confirm(`Xoá lịch sử ôn tập phần ${M.name} trên trình duyệt này?`)) return;
  for(const v of ITEMS) delete stats[v.id];
  store.set('stats',stats); renderSetup();
};
$('#themeBtn').onclick=()=>{
  const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark'; store.set('theme',r.dataset.theme);
};
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hidden')||!S) return;
  if(e.target.tagName==='INPUT') return;
  if(/^[1-9]$/.test(e.key)) choose(+e.key-1);
  else if(/^[a-dA-D]$/.test(e.key)) choose('abcd'.indexOf(e.key.toLowerCase()));
  else if(e.key==='ArrowRight'||e.key==='Enter') next();
  else if(e.key==='ArrowLeft') go(S.cur-1);
});
document.title = M.title + ' ' + (M.exam||'BJT');
renderSetup();

</script>
