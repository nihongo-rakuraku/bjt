lse,"ex":[["先生に教えてもらった方法を、早速試してみた。","Tôi thử ngay cách thầy chỉ cho."]],"au":"t/a46047bf6164","eau":["t/28a2e9bbff47"]},{"id":"n3v-x1835","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"あっという間","r":"あっというま","m":"thoáng chốc, trong nháy mắt","en":"in an instant","s":false,"ex":[["楽しい時間は、あっという間に過ぎる。","Thời gian vui vẻ trôi qua trong chớp mắt."]],"au":"t/f38f447e81d3","eau":["t/1d56a329f827"]},{"id":"n3v-x1836","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"突然","r":"とつぜん","m":"đột ngột, bất ngờ","en":"suddenly","s":false,"ex":[["晴れていたのに、突然雨が降り出した。","Trời đang nắng thì bỗng nhiên mưa đổ xuống."]],"au":"t/0664b4f3adb9","eau":["t/07d96d3917b0"]},{"id":"n3v-x1837","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"今にも","r":"いまにも","m":"sắp sửa (ngay bây giờ)","en":"at any moment","s":false,"ex":[["空が暗くなって、今にも雨が降りそうだ。","Trời tối sầm lại, mưa như sắp đổ xuống đến nơi."]],"au":"t/25d299c36aa4","eau":["t/d17573bf9a11"]},{"id":"n3v-x1838","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"まもなく","r":"まもなく","m":"sắp, chẳng bao lâu nữa","en":"soon, shortly","s":false,"ex":[["まもなく、一番線に電車がまいります。","Tàu sắp vào sân ga số một."]],"au":"t/fcc3d439cd89","eau":["t/43c2707e3da3"]},{"id":"n3v-x1839","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"ついに","r":"ついに","m":"cuối cùng thì","en":"at last, finally","s":false,"ex":[["何度も失敗したが、ついに試験に合格した。","Thất bại nhiều lần nhưng cuối cùng tôi đã thi đỗ."]],"au":"t/d615e86d73ab","eau":["t/73d05f83a106"]},{"id":"n3v-x1840","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"次第に","r":"しだいに","m":"dần dần","en":"gradually","s":false,"ex":[["秋になって、次第に日が短くなってきた。","Sang thu, ngày dần dần ngắn lại."]],"au":"t/cde3aae3af48","eau":["t/342e285362b2"]},{"id":"n3v-x1841","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"めったに","r":"めったに","m":"hiếm khi","en":"rarely","s":false,"ex":[["この辺りでは、冬でも雪はめったに降らない。","Vùng này dù mùa đông cũng hiếm khi có tuyết."]],"au":"t/d458a903389e","eau":["t/3ccdd53addaa"]},{"id":"n3v-x1842","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 2","l":16,"w":"相変わらず","r":"あいかわらず","m":"như mọi khi, vẫn như cũ","en":"as usual, as ever","s":false,"ex":[["駅前は、相変わらず人が多い。","Trước ga vẫn đông người như mọi khi."]],"au":"t/2f6a82762b53","eau":["t/4d865f757da7"]},{"id":"n3v-x1843","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"実は","r":"じつは","m":"thật ra là","en":"actually, to tell the truth","s":false,"ex":[["実は、来月会社を辞めることになったんです。","Thật ra là tháng sau tôi sẽ nghỉ việc ở công ty."]],"au":"t/4c880a0e0ccd","eau":["t/7e4b294be1d4"]},{"id":"n3v-x1844","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"確かに","r":"たしかに","m":"đúng là, quả thật","en":"certainly, indeed","s":false,"ex":[["確かに彼の言うとおりだが、すぐには賛成できない。","Đúng là như anh ấy nói, nhưng tôi không thể tán thành ngay được."]],"au":"t/d6478458ca9d","eau":["t/ef751e1c01ec"]},{"id":"n3v-x1845","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"決して","r":"けっして","m":"tuyệt đối không","en":"never, by no means","s":false,"ex":[["あなたに助けてもらったことは、決して忘れません。","Việc được bạn giúp đỡ, tôi tuyệt đối không bao giờ quên."]],"au":"t/730404608b50","eau":["t/f4ee38f8247a"]},{"id":"n3v-x1846","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"たとえ","r":"たとえ","m":"cho dù, dẫu cho","en":"even if","s":false,"ex":[["たとえ雨が降っても、試合は予定どおり行う。","Cho dù trời có mưa, trận đấu vẫn diễn ra như dự định."]],"au":"t/ce0ba1898d31","eau":["t/ae47114d9ec3"]},{"id":"n3v-x1847","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"もしかすると","r":"もしかすると","m":"biết đâu, có lẽ","en":"perhaps, possibly","s":false,"ex":[["もしかすると、彼は約束を忘れているのかもしれない。","Biết đâu anh ấy đã quên lời hẹn rồi cũng nên."]],"au":"t/542a12db4d84","eau":["t/de73506df0fd"]},{"id":"n3v-x1848","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"どうやら","r":"どうやら","m":"hình như, xem chừng","en":"apparently, it seems","s":false,"ex":[["空が暗くなってきた。どうやら雨が降りそうだ。","Trời tối dần rồi. Xem chừng sắp mưa."]],"au":"t/52fa2812ddd8","eau":["t/f96ee34430b3"]},{"id":"n3v-x1849","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"いくら","r":"いくら","m":"dù bao nhiêu (đi nữa)","en":"no matter how (much)","s":false,"ex":[["いくら練習しても、なかなか上手にならない。","Luyện tập bao nhiêu đi nữa cũng mãi không giỏi lên."]],"au":"t/b90e2e1a940b","eau":["t/ac067af866be"]},{"id":"n3v-x1850","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"一体","r":"いったい","m":"rốt cuộc là (cái gì)","en":"on earth, what in the world","s":false,"ex":[["こんな夜中に、一体だれが電話してきたんだろう。","Nửa đêm thế này, rốt cuộc ai gọi điện tới vậy nhỉ."]],"au":"t/45bf703996f3","eau":["t/021bcf205e2e"]},{"id":"n3v-x1851","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"さすが","r":"さすが","m":"quả đúng là, không hổ danh","en":"as expected (of)","s":false,"ex":[["一回で合格するなんて、さすが彼女だ。","Đỗ ngay lần đầu, quả không hổ danh là cô ấy."]],"au":"t/69827e21f346","eau":["t/d649f1d63c48"]},{"id":"n3v-x1852","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"なぜか","r":"なぜか","m":"chẳng hiểu sao","en":"for some reason","s":false,"ex":[["この歌を聞くと、なぜか涙が出てくる。","Nghe bài hát này, chẳng hiểu sao nước mắt lại trào ra."]],"au":"t/e1c5a2b66483","eau":["t/3899a57360b0"]},{"id":"n3v-x1853","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"何とか","r":"なんとか","m":"bằng cách nào đó, xoay xở được","en":"somehow, manage to","s":false,"ex":[["道に迷ったが、何とか約束の時間に着いた。","Lạc đường nhưng rồi tôi cũng xoay xở đến kịp giờ hẹn."]],"au":"t/bdb1b5026528","eau":["t/57c63b9a33a6"]},{"id":"n3v-x1854","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"自然に","r":"しぜんに","m":"một cách tự nhiên","en":"naturally","s":false,"ex":[["日本に住んでいるうちに、自然に日本語が話せるようになった。","Sống ở Nhật một thời gian, tôi tự nhiên nói được tiếng Nhật."]],"au":"t/debec3a00acf","eau":["t/53c18bfd1b3d"]},{"id":"n3v-x1855","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"本来","r":"ほんらい","m":"đúng ra, về bản chất","en":"originally, by nature","s":false,"ex":[["本来なら社長が伺うべきところですが、今日は代わりに私がまいりました。","Đúng ra giám đốc phải đến, nhưng hôm nay tôi đến thay ạ."]],"au":"t/5a2b7a7fb116","eau":["t/1bc2a938b7f3"]},{"id":"n3v-x1856","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"もともと","r":"もともと","m":"vốn dĩ, từ đầu","en":"originally, from the start","s":false,"ex":[["彼はもともと静かな性格なので、怒っているわけではない。","Anh ấy vốn tính trầm lặng chứ không phải đang giận đâu."]],"au":"t/e96065837625","eau":["t/cf0b37f4ce12"]},{"id":"n3v-x1857","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"共に","r":"ともに","m":"cùng với, cùng nhau","en":"together","s":false,"ex":[["これからも、社員と共に会社を大きくしていきたい。","Từ nay tôi muốn cùng với nhân viên phát triển công ty lớn mạnh hơn."]],"au":"t/01df4c535a06","eau":["t/1a571e9e8cfd"]},{"id":"n3v-x1858","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 1","l":17,"w":"直接","r":"ちょくせつ","m":"trực tiếp","en":"directly","s":false,"ex":[["大事な話なので、メールではなく直接会って話したい。","Chuyện quan trọng nên tôi muốn gặp trực tiếp để nói chứ không qua email."]],"au":"t/04fdd1cb8534","eau":["t/2b13cc5d64fc"]},{"id":"n3v-x1859","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"別々","r":"べつべつ","m":"riêng rẽ, tách riêng","en":"separately","s":false,"ex":[["お会計は別々にお願いします。","Cho chúng tôi thanh toán riêng ạ."]],"au":"t/47d39327b833","eau":["t/e7a4be775b96"]},{"id":"n3v-x1860","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"それぞれ","r":"それぞれ","m":"mỗi (người, cái)","en":"each, respectively","s":false,"ex":[["人には、それぞれ違う考え方がある。","Mỗi người đều có cách nghĩ khác nhau."]],"au":"t/8ca169ed8ad9","eau":["t/423968a57593"]},{"id":"n3v-x1861","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"各自","r":"かくじ","m":"mỗi người tự (mình)","en":"each person","s":false,"ex":[["明日の遠足には、お弁当を各自で持ってきてください。","Buổi dã ngoại mai, mỗi người tự mang cơm hộp theo nhé."]],"au":"t/5c981d315629","eau":["t/7ce6608d8d39"]},{"id":"n3v-x1862","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"意外と","r":"いがいと","m":"không ngờ là, hóa ra","en":"surprisingly","s":false,"ex":[["この料理は見た目は地味だが、意外とおいしい。","Món này trông đơn giản nhưng không ngờ lại ngon."]],"au":"t/b3abc36f05c4","eau":["t/09523d48e3dd"]},{"id":"n3v-x1863","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"何しろ","r":"なにしろ","m":"dù sao thì, bởi vì (nhấn mạnh)","en":"anyway, after all","s":false,"ex":[["疲れたよ。何しろ朝から十時間も歩いたんだから。","Mệt quá. Dù sao thì cũng đi bộ tận mười tiếng từ sáng rồi mà."]],"au":"t/74aad1a8ea87","eau":["t/e011e6f8958d"]},{"id":"n3v-x1864","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"おそらく","r":"おそらく","m":"có lẽ","en":"probably","s":false,"ex":[["この雨では、おそらく試合は中止だろう。","Mưa thế này thì có lẽ trận đấu sẽ bị hủy."]],"au":"t/88326119f525","eau":["t/4b4bac9d315e"]},{"id":"n3v-x1865","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"まさか","r":"まさか","m":"lẽ nào, không ngờ","en":"no way, surely not","s":false,"ex":[["まさか自分が宝くじに当たるとは思わなかった。","Tôi không ngờ mình lại trúng xổ số."]],"au":"t/fa0ee1389663","eau":["t/a484da6bc8e1"]},{"id":"n3v-x1866","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"やはり","r":"やはり","m":"quả nhiên, rốt cuộc vẫn","en":"as expected, after all","s":false,"ex":[["天気予報のとおり、やはり午後から雨になった。","Đúng như dự báo, quả nhiên từ chiều trời mưa."]],"au":"t/12d5f798beb3","eau":["t/09f10822f368"]},{"id":"n3v-x1867","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"結局","r":"けっきょく","m":"rốt cuộc, cuối cùng","en":"after all, in the end","s":false,"ex":[["何度も話し合ったが、結局その計画は中止になった。","Bàn bạc mấy lần, rốt cuộc kế hoạch đó vẫn bị hủy."]],"au":"t/9d02e47f3afe","eau":["t/157c3239dcdc"]},{"id":"n3v-x1868","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"わざと","r":"わざと","m":"cố tình","en":"on purpose","s":false,"ex":[["子どもと遊ぶとき、父はわざと負けてあげる。","Khi chơi với con, bố tôi cố tình thua."]],"au":"t/a8191462cb3d","eau":["t/b95373ba6f2a"]},{"id":"n3v-x1869","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"わざわざ","r":"わざわざ","m":"cất công","en":"go out of one's way","s":false,"ex":[["忘れた傘を、友達がわざわざ家まで届けてくれた。","Bạn tôi cất công mang chiếc ô tôi bỏ quên đến tận nhà."]],"au":"t/8da1cb2154d3","eau":["t/5074bbfd06a4"]},{"id":"n3v-x1870","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"せっかく","r":"せっかく","m":"mất công, hiếm hoi mới có","en":"with much effort, rare chance","s":false,"ex":[["せっかく京都まで来たのだから、有名なお寺を見ていこう。","Đã mất công đến tận Kyoto thì ghé xem ngôi chùa nổi tiếng đi."]],"au":"t/d010ae5bcef1","eau":["t/65ae4d80220c"]},{"id":"n3v-x1871","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thaido","tn":"Phó từ thái độ","tja":"気持ち・判断の副詞","gl":"Phó từ thái độ 2","l":18,"w":"思い切って","r":"おもいきって","m":"mạnh dạn, dứt khoát","en":"boldly, resolutely","s":false,"ex":[["迷ったが、思い切って会社を辞めて留学した。","Đắn đo mãi, cuối cùng tôi mạnh dạn nghỉ việc đi du học."]],"au":"t/feaf04a2bc24","eau":["t/37cabeb81ef4"]},{"id":"n3v-x1872","set":   const N2 = MODULE!=='vocab';   // chế độ JLPT (N2 hoặc N3): chia theo lĩnh vực/chủ đề, mục lục bên trái
  const LV = MODULE==='vocab-n3' ? 'N3' : 'N2';
  const hasKanji = s => /[一-鿿々]/.test(s);
  const isKata = s => /^[゠-ヿー・Ａ-Ｚa-zA-Z0-9\s]+$/.test(s);
  const forms = w => { const out=[]; const m=w.match(/^(.*?)（(.*?)）(.*)$/);
    if(m){ out.push(m[1]+m[3]); out.push(m[2]); } else out.push(w);
    return out.map(s=>s.replace(/[～〜~]/g,'').trim()).filter(Boolean); };
  const mainForm = w => forms(w)[0];
  const shortMeaning = m => { let s=m.split(/[:：·]/)[0].trim();
    if(s.length>70) s=s.replace(/\s*\(.*?\)\s*/g,' ').trim();
    if(s.length>70) s=s.slice(0,68).replace(/[,\s]+\S*$/,'')+'…';
    return s.replace(/[.。]+$/,''); };
  const wordClass = w => { const f=mainForm(w); if(isKata(f)) return 'kata'; if(/[ぁ-ん]$/.test(f)) return 'kana-end'; return 'kanji'; };
  const findIn = v => { for(const ex of v.ex) for(const f of forms(v.w).sort((a,b)=>b.length-a.length)){ const i=ex[0].indexOf(f); if(i>=0) return {ex,i,f,k:v.ex.indexOf(ex)}; } return null; };
  const hitHTML = (hit,tag) => { const s=hit.ex[0]; return esc(s.slice(0,hit.i))+`<${tag}>`+esc(hit.f)+`</${tag}>`+esc(s.slice(hit.i+hit.f.length)); };

  // reading distractors: near-miss kana (voicing, っ, long vowels, ょ/ゅ, ん)
  const VOICE = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
  const UNVOICE = Object.fromEntries(Object.entries(VOICE).map(([a,b])=>[b,a]));
  Object.assign(UNVOICE,{'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ'});
  const HPMAP = {'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ','ば':'ぱ','び':'ぴ','ぶ':'ぷ','べ':'ぺ','ぼ':'ぽ'};
  const OROW = 'おこごそぞとどのほぼぽもよろょ', SOKU = 'かきくけこさしすせそたちつてとぱぴぷぺぽ';
  const mutations = r => { const out=new Set(); const ch=[...r];
    ch.forEach((c,i)=>{
      const rep = x => { const a=ch.slice(); a[i]=x; out.add(a.join('')); };
      const del = () => { const a=ch.slice(); a.splice(i,1); out.add(a.join('')); };
      if(VOICE[c]) rep(VOICE[c]); if(UNVOICE[c]) rep(UNVOICE[c]); if(HPMAP[c]) rep(HPMAP[c]);
      if(c==='っ'){ del(); rep('つ'); }
      if(c==='ょ') rep('ゅ'); if(c==='ゅ') rep('ょ');
      if(c==='う' && i>0 && OROW.includes(ch[i-1])) del();
      if(c==='い' && i>0 && 'えけげせぜてでねへべめれ'.includes(ch[i-1])) del();
      if(c==='ん' && i>0) del();
      if(i>0 && SOKU.includes(c) && ch[i-1]!=='っ' && ch[i-1]!=='ん'){ const a=ch.slice(); a.splice(i,0,'っ'); out.add(a.join('')); }
      if(OROW.includes(c) && ch[i+1]!=='う' && ch[i+1]!=='ょ'){ const a=ch.slice(); a.splice(i+1,0,'う'); out.add(a.join('')); }
    });
    out.delete(r); return [...out].filter(s=>!/^[っんー]/.test(s)); };
  // second tier: swap one kana for another vowel in the same row (あまい → あめい, あまえ)
  const ROWS = ['あいうえお','かきくけこ','がぎぐげご','さしすせそ','ざじずぜぞ','たちつてと','だぢづでど','なにぬねの','はひふへほ','ばびぶべぼ','ぱぴぷぺぽ','まみむめも','やゆよ','らりるれろ','わを'];
  const vowelSwaps = r => { const out=new Set(); const ch=[...r];
    ch.forEach((c,i)=>{ if(ch[i+1]&&'ゃゅょ'.includes(ch[i+1])) return; const row=ROWS.find(x=>x.includes(c)); if(!row) return;
      for(const x of row) if(x!==c && !(x==='を')){ const a=ch.slice(); a[i]=x; out.add(a.join('')); } });
    out.delete(r); return [...out].filter(s=>!/^[っんー]/.test(s)); };
  const readingOptions = v => { const r=v.r; let pool=shuffle(mutations(r));
    // cách đọc cũng đúng (v.alt, vd 依存 いそん) hoặc cách đọc của cùng chữ ở mục khác (辛い つらい/からい) không làm nhiễu
    const ok=[r, ...(v.alt||[]), ...DATA.filter(o=>o.w===v.w && o.r).map(o=>o.r)];
    if(pool.length<3) pool=pool.concat(shuffle(vowelSwaps(r)));
    if(pool.length<3) pool=pool.concat(shuffle(pool.flatMap(mutations)).filter(x=>x!==r));
    let res=pickN(pool,3,ok);
    if(res.length<3) res=res.concat(pickN(DATA.filter(o=>o.r && /^[ぁ-ん]+$/.test(o.r) && Math.abs(o.r.length-r.length)<=1).map(o=>o.r),3-res.length,[...ok,...res]));
    return res; };
  // o cannot be a distractor for v when it would also be a right answer: same or nested meaning,
  // same kanji stem (折り合い/折り合う), or one written form inside the other (解決/解決策)
  const parts = m => shortMeaning(m||'').toLowerCase().split(/[,，;/、]/).map(x=>x.replace(/\(.*?\)/g,'').trim()).filter(x=>x.length>1);
  const stem = w => mainForm(w).replace(/[ぁ-ん]+$/,'');
  const clash = (v,o) => {
    if(!o.m) return true;
    const a=parts(v.m), b=parts(o.m), am=v.m.toLowerCase(), bm=o.m.toLowerCase();
    if(a.some(x=>b.includes(x)) || b.some(x=>am.includes(x)) || a.some(x=>bm.includes(x))) return true;
    const sv=stem(v.w), so=stem(o.w); if(sv && sv===so && hasKanji(sv)) return true;
    const fv=mainForm(v.w), fo=mainForm(o.w); return fv.includes(fo) || fo.includes(fv);
  };
  const others = (v,pool,n,key,filter0) => { const filter = o => !clash(v,o) && (!filter0 || filter0(o)); let c=pickN(pool.filter(o=>o.id!==v.id&&(!filter||filter(o))).map(key),n,[key(v)]);
    if(c.length<n) c=c.concat(pickN(DATA.filter(o=>o.id!==v.id&&(!filter||filter(o))).map(key),n-c.length,[key(v),...c])); return c; };

  // vocab comes in sets ("bộ"): the 2200-word book (45 lessons) and the 600+ list. Items of the 2200 set keep group key = lesson
  // number, so progress saved before keeps working; items of another set carry v.set and use group key "set:lesson".
  const BASE = N2 ? LV.toLowerCase() : '2200';
  const setOf = v => v.set || BASE;
  const groupOf = v => setOf(v)===BASE ? String(v.l) : setOf(v)+':'+v.l;
  const groups=[]; DATA.forEach(v=>{ const k=groupOf(v); if(!groups.some(g=>g.k===k)) groups.push({k, label:v.gl||String(v.l), set:setOf(v), tp:v.tp}); });
  // N2: mỗi lĩnh vực (v.set, tên v.dn) là một tab; trong tab mỗi bài là một phần của một chủ đề (v.tp, tên v.tn, nhãn bài v.gl)
  const SETS=(N2 ? [...new Set(DATA.map(v=>v.set))].map(k=>{ const vs=DATA.filter(v=>v.set===k), tps=[...new Map(vs.map(v=>[v.tp,v.tn])).entries()];
    return {k, label:vs[0].dn, note:`${tps.length} chủ đề`, sub:`Mỗi lượt 20 câu, lấy từ các bài đã chọn. Mỗi bài là một nhóm từ cùng chủ đề, nên đáp án nhiễu đều là từ gần nghĩa. Chọn nhanh cả chủ đề ở các nút bên dưới.`,
      quick:tps.map(([t,n])=>['tp:'+t,n])}; }) : [
    {k:'2200', label:'2200 từ BJT', note:'45 bài', sub:'Mỗi lượt 20 câu, lấy từ các bài đã chọn. 45 bài theo sách “Chinh phục từ vựng BJT”. Thanh xanh = tỉ lệ từ đã trả lời đúng ít nhất 1 lần.',
     quick:[['1-15','Bài 1–15'],['16-30','Bài 16–30'],['31-45','Bài 31–45']]},
    {k:'600', label:'600+ từ thường gặp', sub:'Tổng hợp 600+ từ vựng BJT thường gặp.', quick:[]},
  ]).map(s=>({...s, count:DATA.filter(v=>setOf(v)===s.k).length}));
  MODULES[MODULE] = {
    key:MODULE, name:N2?'Từ vựng '+LV:'Từ vựng', title:N2?'Ôn tập từ vựng '+LV:'Ôn tập từ vựng', quizTitle:N2?'Kiểm tra từ vựng '+LV:'Kiểm tra từ vựng', unit:'từ', exam:N2?'JLPT '+LV:'BJT',
    items: DATA,
    sets: N2 ? null : SETS, setOfGroup: k => (groups.find(g=>g.k===k)||{}).set,   // N2: chọn qua mục lục chủ đề, không khoá theo tab
    groupTitle:'Chọn bài', groupSub:SETS[0].sub,
    groups, groupOf,
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn']],
    wideGroups: N2,
    select: (k,set) => { const gs=groups.filter(g=>g.set===set); return k==='all'?gs.map(g=>g.k):k==='none'?[]:k.startsWith('tp:')?gs.filter(g=>g.tp===k.slice(3)).map(g=>g.k):(([a,b])=>gs.filter(g=>+g.label>=a&&+g.label<=b).map(g=>g.k))(k.split('-').map(Number)); },
    types:[
      {k:'doc',  label:'Cách đọc · 漢字読み', name:'Cách đọc', desc:'Chọn cách đọc đúng của từ Kanji'},
      {k:'nghia',label:'Ý nghĩa · 意味', name:'Ý nghĩa', desc:'Từ tiếng Nhật → nghĩa tiếng Việt'},
      {k:'tu',   label:'Chọn từ · 語彙', name:'Chọn từ', desc:'Nghĩa tiếng Việt → từ tiếng Nhật'},
      {k:'dien', label:'Điền từ · 文脈規定', name:'Điền vào câu', desc:'Chọn từ hợp với chỗ trống trong câu'},
    ],
    canDo(t,v){
      if(t==='doc') return !!v.r && /^[ぁ-んー]+$/.test(v.r) && hasKanji(v.w);
      if(t==='nghia'||t==='tu') return !!v.m;
      if(t==='dien') return !!v.m && !!findIn(v);
      return false;
    },
    build(t,v,pool){
      if(t==='doc'){
        const hit=findIn(v);
        return {ask:'Từ gạch chân đọc như thế nào?',
          stem: hit?`<div class="sent jp">${hitHTML(hit,'u')}</div>`:`<div class="bigword jp"><u>${esc(mainForm(v.w))}</u></div>`,
          options: shuffle([{t:v.r,ok:true},...readingOptions(v).map(x=>({t:x,ok:false}))])};
      }
      if(t==='nghia'){
        const hit=findIn(v), cls=wordClass(v.w);
        return {ask:'Từ sau có nghĩa là gì?', optClass:'vi',
          stem:`<div class="bigword jp">${esc(v.w.replace(/（.*?）/,''))}</div>`+(hit?`<div class="sent jp sub">${hitHTML(hit,'u')}</div>`:''),
          options: shuffle([{t:shortMeaning(v.m),ok:true},...others(v,pool,3,o=>o.m&&shortMeaning(o.m),o=>!!o.m&&wordClass(o.w)===cls).map(x=>({t:x,ok:false}))])};
      }
      if(t==='tu'){
        const cls=wordClass(v.w);
        return {ask:'Từ nào mang nghĩa sau?',
          stem:`<div class="bigvi">${esc(shortMeaning(v.m))}</div>`+(v.en?`<div class="hint">EN: ${esc(v.en)}</div>`:''),
          options: shuffle([{t:mainForm(v.w),ok:true},...others(v,pool,3,o=>mainForm(o.w),o=>wordClass(o.w)===cls).map(x=>({t:x,ok:false}))])};
      }
      const hit=findIn(v), cls=wordClass(hit.f), s=hit.ex[0];
      return {ask:'Chọn từ thích hợp điền vào chỗ trống.',
        stem:`<div class="sent jp">${esc(s.slice(0,hit.i))}<span class="blank">&emsp;&emsp;</span>${esc(s.slice(hit.i+hit.f.length))}</div>`,
        options: shuffle([{t:hit.f,ok:true},...others(v,pool,3,o=>mainForm(o.w),o=>wordClass(o.w)===cls&&!s.includes(mainForm(o.w))&&!hit.f.includes(mainForm(o.w))&&!mainForm(o.w).includes(hit.f)).map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      const ex=v.ex.map((e,k)=>`<div class="ex"><div class="j jp">${rb(e[0])} ${spk(e[0],N2?(v.eau||[])[k]:`e/${v.id}-${k}`)}</div><div class="v">${esc(e[1])}</div></div>`).join('');
      return `<div class="explain ${right?'':'wrong'}">
        <div class="w jp">${esc(v.w)}${v.r?`<small>「${esc(v.r)}」</small>`:''}${spk(v.r||mainForm(v.w),N2?v.au:'w/'+v.id)}</div>
        <div class="m">${esc(v.m||'')}${v.s?' <span class="en">(～する)</span>':''}</div>
        <div class="en">${esc(v.en||'')} · ${N2?esc(v.gl):'Bài '+v.l}</div>${ex}</div>`;
    },
    summary: v => ({title:`${esc(v.w)}${v.r?`<small>「${esc(v.r)}」</small>`:''}`, sub:`${esc(shortMeaning(v.m||''))} · ${N2?esc(v.gl):'Bài '+v.l}`}),
    autoplay: (q,v) => ({text:v.r||mainForm(v.w), key:N2?v.au:'w/'+v.id}),
  };
  // N2: mục lục bên trái (lĩnh vực → chủ đề, tick để ôn), bên phải danh sách từ của chủ đề đang xem, chia theo phần (= bài)
  if(N2){
    const TOPICS=[...new Map(DATA.map(v=>[v.tp,{k:v.tp,n:v.tn,ja:v.tja,set:v.set}])).values()];
    const DOMS=[...new Map(DATA.map(v=>[v.set,{k:v.set,n:v.dn,ja:v.dja}])).values()].map(d=>({...d, t:TOPICS.filter(t=>t.set===d.k)}));
    const gOf = tp => groups.filter(g=>g.tp===tp).map(g=>g.k);
    let curTp=null;
    const Mv=MODULES[MODULE]; Mv.groupsInMap=true; Mv.defaultGroups=gOf(TOPICS[0].k);   // lần đầu: chọn trọn chủ đề đầu tiên
    Mv.renderMap = () => {
      if(curTp===null){ curTp=store.get(LV.toLowerCase()+'vmap', TOPICS[0].k); if(!TOPICS.some(t=>t.k===curTp)) curTp=TOPICS[0].k; }
      document.body.classList.add('mm-wide');
      const P=$('#mapPanel'); P.classList.remove('hidden');
      const T=TOPICS.find(t=>t.k===curTp), D=DOMS.find(d=>d.k===T.set), parts=gOf(curTp);
      const tick = tp => { const gs=gOf(tp), n=gs.filter(g=>prefs.groups.includes(g)).length; return n===0?'':n===gs.length?'checked':'data-part'; };
      const nTicked = prefs.groups.filter(g=>groups.some(x=>x.k===g)).length;
      const row = t => { const vs=DATA.filter(v=>v.tp===t.k), known=vs.filter(v=>stats[v.id]&&stats[v.id].c>0).length;
        return `<div class="mm-item ${t.k===curTp?'on':''}"><label class="mm-tick" title="Chọn để ôn"><input type="checkbox" data-vt-tick="${t.k}" ${tick(t.k)}></label>
          <button class="mm-name" data-vt="${t.k}"><i class="jp">${esc((t.ja||'').slice(0,1))}</i><span>${esc(t.n)} <small>${vs.length}</small></span><em><b style="width:${known/vs.length*100}%"></b></em></button></div>`; };
      const wordRow = v => `<li><span class="wl-w jp">${esc(v.w)}</span><span class="wl-r jp">${esc(v.r||'')}</span><span class="wl-m">${esc(v.m||'')}</span>${spk(v.r||mainForm(v.w),v.au)}</li>`;
      P.innerHTML = `<h2>Mục lục chủ đề</h2><p class="sub">Chọn chủ đề ở mục lục để xem danh sách từ; tick các chủ đề muốn ôn rồi bấm “Ôn các chủ đề đã chọn”. Mỗi chủ đề chia thành vài phần khoảng 20 từ.</p>
        <div class="mm-layout">
          <aside class="mm-toc">
            <div class="mm-blocks">${DOMS.map(d=>`<button class="mm-tab ${d===D?'on':''}" data-vt="${d.t[0].k}"><i class="jp">${esc(d.ja.slice(0,1))}</i>${esc(d.n)}</button>`).join('')}</div>
            ${DOMS.map(d=>`<section class="mm-blk ${d===D?'on':''}"><h3><span class="jp">${esc(d.ja.slice(0,1))}</span>${esc(d.n)}</h3>${d.t.map(row).join('')}</section>`).join('')}
            <div class="mm-toc-foot"><button class="btn" data-vt-ticked ${nTicked?'':'disabled'}>Ôn các chủ đề đã chọn${nTicked?` (${prefs.groups.filter(g=>groups.some(x=>x.k===g)).reduce((n,g)=>n+ITEMS.filter(v=>groupOf(v)===g).length,0)} từ)`:''}</button></div>
          </aside>
          <div class="mm-main">
            <div class="mm-head"><b>${esc(T.n)}</b> <span class="jp">${esc(T.ja||'')}</span><p>${esc(D.n)} · ${DATA.filter(v=>v.tp===curTp).length} từ · ${parts.length} phần</p></div>
            ${parts.map((g,i)=>{ const vs=DATA.filter(v=>groupOf(v)===g); return `<div class="wl-part"><div class="wl-ph"><b>Phần ${i+1}</b><small>${vs.length} từ</small><button class="mini" data-vt-go="${g}">Ôn phần này →</button></div><ol class="wl">${vs.map(wordRow).join('')}</ol></div>`; }).join('')}
            <div class="row mm-go"><button class="btn" data-vt-go="${parts.join(',')}">Ôn cả chủ đề · ${DATA.filter(v=>v.tp===curTp).length} từ</button></div>
          </div>
        </div>`;
      P.querySelectorAll('[data-part]').forEach(c=>c.indeterminate=true);
      { const on=P.querySelector('.mm-blocks .on'), bar=on&&on.parentNode; if(on && bar.scrollWidth>bar.clientWidth) bar.scrollLeft = on.offsetLeft - bar.offsetLeft - (bar.clientWidth - on.offsetWidth)/2; }
      const start = gs => { prefs.groups=gs; renderSetup(); startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode)); };
      P.onchange = e => { const t=e.target.closest('[data-vt-tick]'); if(!t) return; const gs=gOf(t.dataset.vtTick);
        prefs.groups = t.checked ? [...new Set([...prefs.groups,...gs])] : prefs.groups.filter(x=>!gs.includes(x)); renderSetup(); };
      P.onclick = e => {
        const b=e.target.closest('[data-vt],[data-vt-go],[data-vt-ticked]'); if(!b) return;
        if(b.dataset.vt){ curTp=b.dataset.vt; store.set(LV.toLowerCase()+'vmap',curTp); Mv.renderMap(); if(innerWidth>860) P.querySelector('.mm-main').scrollIntoView({block:'nearest'}); }
        else if(b.dataset.vtGo){ start(b.dataset.vtGo.split(',')); }
        else if(b.dataset.vtTicked!==undefined){ start(prefs.groups.filter(g=>groups.some(x=>x.k===g))); }
      };
    };
  }
}

/* ---------------- Ngữ pháp ---------------- */
if(MODULE==='grammar'){
  const SIZE=20;
  const groups=[]; for(let a=1;a<=DATA.length;a+=SIZE){ const b=Math.min(a+SIZE-1,DATA.length); groups.push({k:`${a}-${b}`,label:`${a}–${b}`}); }
  const groupOf = v => groups.find(g=>{ const [a,b]=g.k.split('-').map(Number); return v.no>=a&&v.no<=b; }).k;
  const frags = p => p.replace(/^（.*?）/,'').replace(/（.*?）|\(.*?\)/g,'～').split(/[～〜…]|・・・/).map(x=>x.trim()).filter(Boolean);
  const fits = (p, line) => { let pos=0; for(const f of frags(p)){ const i=line.indexOf(f,pos); if(i<0) return false; pos=i+f.length; } return true; };
  const lineHTML = (v, li, mode) => { // mode: 'blank' | 'mark' | 'plain'
    const s=v.lines[li][1];
    if(mode==='mark') return rb(s, v.hit&&v.hit[0]===li ? v.hit[1].map(([a,b])=>[a,b,'mark']) : []);  // giải thích: có ルビ
    if(mode==='plain'||!v.hit||v.hit[0]!==li) return esc(s);
    let out='', pos=0;
    for(const [a,b] of v.hit[1]){ out+=esc(s.slice(pos,a)) + (mode==='blank'?'<span class="blank">&emsp;&emsp;</span>':`<mark>${esc(s.slice(a,b))}</mark>`); pos=b; }
    return out+esc(s.slice(pos)); };
  const dialog = (v, mode, withTr, audio) =>
    (v.ctx.length?`<div class="ctx">${v.ctx.map(esc).join(' ')}</div>`:'') +
    `<div class="dlg">${v.lines.map((l,li)=>`<div class="ln ${v.hit&&v.hit[0]===li?'focus':''}"><span class="spk">${esc(l[0])}</span><div>
      <div class="jp">${lineHTML(v,li,mode)}${audio?' '+spk(l[1],v.au&&v.au[li]):''}</div>
      <div class="tr ${withTr?'':'hidden'}">${esc(l[2])}</div></div></div>`).join('')}</div>`;
  MODULES.grammar = {
    key:'grammar', name:'Ngữ pháp', title:'Ôn tập ngữ pháp', quizTitle:'Kiểm tra ngữ pháp', unit:'mẫu',
    items: DATA,
    groupTitle:'Chọn nhóm mẫu', groupSub:'117 mẫu ngữ pháp BJT J3~J2 thường gặp, chia nhóm 20 mẫu. Mỗi lượt tối đa 20 câu.',
    groups, groupOf, wideGroups:true,
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn']],
    select: k => k==='all'?groups.map(g=>g.k):[],
    types:[{k:'dien', label:'Ngữ pháp · 文法', name:'Điền mẫu ngữ pháp', desc:'Chọn mẫu ngữ pháp hợp với chỗ trống trong hội thoại'}],
    canDo: (t,v) => !!v.hit,
    build(t,v,pool){
      const line=v.lines[v.hit[0]][1];
      const pick = list => pickN(list.filter(o=>o.id!==v.id && !fits(o.p,line)).map(o=>o.p),3,[v.p]);
      let d=pick(pool); if(d.length<3) d=d.concat(pickN(DATA.filter(o=>o.id!==v.id&&!fits(o.p,line)).map(o=>o.p),3-d.length,[v.p,...d]));
      return {ask:'Chọn mẫu ngữ pháp thích hợp điền vào chỗ trống.',
        stem: dialog(v,'blank',false,false) + `<button class="mini" data-reveal>Gợi ý: xem bản dịch</button>`,
        options: shuffle([{t:v.p,ok:true},...d.map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      const note = v.kt||v.y ? `<dl class="gnote">${v.kt?`<dt>Cấu trúc</dt><dd class="jp">${esc(v.kt)}</dd>`:''}${v.y?`<dt>Nghĩa</dt><dd>${esc(v.y)}</dd>`:''}</dl>` : '';
      return `<div class="explain ${right?'':'wrong'}"><div class="w jp">${esc(v.p)}</div>${note}
        <div class="ex">${dialog(v,'mark',true,true)}</div></div>`;
    },
    summary: v => ({title:esc(v.p), sub:esc(v.y || v.lines[v.hit?v.hit[0]:0][2])}),
    autoplay: (q,v) => v.hit && v.au ? {text:v.lines[v.hit[0]][1], key:v.au[v.hit[0]]} : null,
  };
}

/* ---------------- Kính ngữ ---------------- */
if(MODULE==='keigo'){
  const KIND = {verb:'Động từ', biz:'Từ ngữ công sở', err:'Lỗi thường gặp'};
  const verbs = DATA.filter(v=>v.kind==='verb');
  const allSon = verbs.flatMap(v=>v.son), allKen = verbs.flatMap(v=>v.ken);
  const exclusive = v => [...v.son.filter(f=>!v.ken.includes(f)).map(f=>[f,'son']), ...v.ken.filter(f=>!v.son.includes(f)).map(f=>[f,'ken'])];
  // a form counts as 尊敬語 / 謙譲語 everywhere it appears in the table, so classify only forms that are unambiguous
  const isOnly = (f,kind) => kind==='son' ? allSon.includes(f)&&!allKen.includes(f) : allKen.includes(f)&&!allSon.includes(f);
  // verbs whose keigo forms overlap in real use (上がる/参上する also mean 行く, 召す covers 着る/年をとる…);
  // a "which plain verb?" question never offers a verb from the same family as a distractor
  const FAMILIES = [['行く','来る','訪ねる','いる','帰る'],['言う','伝える','聞かせる'],['見る','読む','見せる'],
    ['思う','考える','知っている','わかる','承諾する'],['受け取る','もらう','食べる'],['着る','食べる','気に入る','風邪を引く','風呂にはいる','年をとる'],
    ['聞く','訪ねる'],['する','利用する','確認する','承諾する','借りる','買う','着る']];
  const related = (a,b) => FAMILIES.some(f=>f.includes(a)&&f.includes(b));
  const LBL = {son:'尊敬語 (Tôn kính ngữ)', ken:'謙譲語 (Khiêm nhường ngữ)', tei:'丁寧語 (Lịch sự ngữ)'};
  const au = t => (DATA_AUDIO[t]||null);
  const EXLBL = {son:'Tôn kính', ken:'Khiêm nhường', biz:'Công sở'};
  const exHTML = v => (v.ex&&v.ex.length) ? `<div class="kex"><div class="kex-h">Ví dụ</div>${v.ex.map(e=>{
      const i=e.ja.indexOf(e.hl), ja = rb(e.ja, i<0 ? [] : [[i, i+e.hl.length, 'mark']]);
      return `<div class="kex-i"><span class="kex-t ${e.k}">${EXLBL[e.k]||''}</span><div><div class="jp">${ja} ${spk(e.say||e.ja,e.au)}</div><div class="v">${esc(e.vi)}</div></div></div>`;
    }).join('')}</div>` : '';
  const verbTable = v => `<table class="kt"><tr><th>Thể thường</th><td class="jp">${esc(v.b)}</td></tr>
      <tr><th>尊敬語<br><small>Tôn kính</small></th><td class="jp">${v.son.map(f=>`${esc(f)}${spk(f,au(f))}`).join('<br>')||'—'}</td></tr>
      <tr><th>謙譲語<br><small>Khiêm nhường</small></th><td class="jp">${v.ken.map(f=>`${esc(f)}${spk(f,au(f))}`).join('<br>')||'—'}</td></tr>
      <tr><th>丁寧語<br><small>Lịch sự</small></th><td class="jp">${v.tei.map(esc).join('、')}</td></tr></table>`;
  MODULES.keigo = {
    key:'keigo', name:'Kính ngữ', title:'Ôn tập kính ngữ', quizTitle:'Kiểm tra kính ngữ', unit:'mục',
    items: DATA,
    groupTitle:'Chọn phần', groupSub:'Theo bảng chia động từ kính ngữ. Mỗi lượt tối đa 20 câu.',
    groups: Object.entries(KIND).map(([k,l])=>({k,label:l})), groupOf: v=>v.kind, wideGroups:true,
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn']],
    select: k => k==='all'?Object.keys(KIND):[],
    types:[
      {k:'son', label:'尊敬語 · Tôn kính ngữ', name:'Tôn kính ngữ', desc:'Chọn dạng tôn kính của động từ'},
      {k:'ken', label:'謙譲語 · Khiêm nhường ngữ', name:'Khiêm nhường ngữ', desc:'Chọn dạng khiêm nhường của động từ'},
      {k:'loai',label:'Phân loại kính ngữ', name:'Phân loại', desc:'Dạng này là tôn kính hay khiêm nhường?'},
      {k:'goc', label:'Động từ gốc', name:'Động từ gốc', desc:'Kính ngữ này của động từ nào?'},
      {k:'biz', label:'Từ ngữ công sở · ビジネス用語', name:'Từ ngữ công sở', desc:'Cách nói trang trọng trong công việc'},
      {k:'err', label:'Sửa lỗi kính ngữ', name:'Sửa lỗi', desc:'Chọn cách nói đúng'},
    ],
    canDo(t,v){
      if(v.kind==='verb'){
        if(t==='son') return v.son.length>0;
        if(t==='ken') return v.ken.length>0;
        if(t==='loai') return exclusive(v).some(([f,k])=>isOnly(f,k));
        if(t==='goc') return v.son.concat(v.ken).some(f=>verbs.filter(o=>o.son.includes(f)||o.ken.includes(f)).length===1);
        return false;
      }
      return t===v.kind;
    },
    build(t,v,pool){
      if(t==='son'||t==='ken'){
        // distractors are forms of the other kind only, so exactly one option is a valid 尊敬語/謙譲語
        const right=v[t], other=t==='son'?'ken':'son', sameKind=t==='son'?allSon:allKen;
        const traps=pickN(v[other].filter(f=>!sameKind.includes(f)),2,[]);
        const rest=pickN(verbs.flatMap(o=>o[other]).filter(f=>!sameKind.includes(f)),3-traps.length,traps);
        return {ask:`Chọn dạng ${t==='son'?'尊敬語 (tôn kính ngữ)':'謙譲語 (khiêm nhường ngữ)'} của động từ sau.`,
          stem:`<div class="bigword jp">${esc(v.b)}</div>`,
          options: shuffle([{t:right[Math.random()*right.length|0],ok:true},...traps.concat(rest).map(x=>({t:x,ok:false}))])};
      }
      if(t==='loai'){
        const [f,k]=shuffle(exclusive(v).filter(([f,k])=>isOnly(f,k)))[0];
        return {ask:'Dạng sau thuộc loại kính ngữ nào?', optClass:'vi', form:f,
          stem:`<div class="bigword jp">${esc(f)}</div>`,
          options:['son','ken','tei'].map(x=>({t:LBL[x],ok:x===k}))};
      }
      if(t==='goc'){
        const f=shuffle(v.son.concat(v.ken).filter(f=>verbs.filter(o=>o.son.includes(f)||o.ken.includes(f)).length===1))[0];
        const d=pickN(verbs.filter(o=>!o.son.includes(f)&&!o.ken.includes(f)&&!related(o.b,v.b)).map(o=>o.b),3,[v.b]);
        return {ask:'Đây là kính ngữ của động từ nào?', form:f,
          stem:`<div class="bigword jp">${esc(f)}</div>`,
          options: shuffle([{t:v.b,ok:true},...d.map(x=>({t:x,ok:false}))])};
      }
      if(t==='biz'){
        const d=pickN(DATA.filter(o=>o.kind==='biz'&&o!==v).map(o=>o.biz),3,[v.biz]);
        return {ask:'Trong công việc, cách nói trang trọng của từ sau là gì?',
          stem:`<div class="bigword jp">${esc(v.plain)}</div>`,
          options: shuffle([{t:v.biz,ok:true},...d.map(x=>({t:x,ok:false}))])};
      }
      return {ask:'Câu sau dùng kính ngữ sai. Chọn cách nói đúng.', optClass:'jp long',
        stem:`<div class="sent jp"><s>${esc(v.wrong)}</s></div>`,
        options: shuffle([{t:v.right,ok:true},...v.dis.filter(x=>x!==v.wrong).map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      let body='';
      if(v.kind==='verb') body=(q.form?`<div class="m jp">${esc(q.form)} ${spk(q.form,au(q.form))}</div>`:'')+verbTable(v)+(v.note?`<div class="en">${esc(v.note)}</div>`:'');
      if(v.kind==='biz') body=`<div class="m jp">${esc(v.plain)} → <b>${esc(v.biz)}</b> ${spk(v.say,au(v.say))}</div>`;
      if(v.kind==='err') body=`<div class="m jp">❌ <s>${esc(v.wrong)}</s></div><div class="m jp">⭕ <b>${esc(v.right)}</b> ${spk(v.right.replace(/（.*?）/,''),au(v.right.replace(/（.*?）/,'')))}</div><div class="en" style="font-size:14px">${esc(v.note)}</div>`;
      return `<div class="explain ${right?'':'wrong'}">${body}${exHTML(v)}</div>`;
    },
    summary: v => v.kind==='verb' ? {title:esc(v.b), sub:`尊敬語: ${esc(v.son.join('、')||'—')} · 謙譲語: ${esc(v.ken.join('、')||'—')}`}
                : v.kind==='biz' ? {title:`${esc(v.plain)} → ${esc(v.biz)}`, sub:KIND.biz}
                : {title:esc(v.right), sub:`Sai: ${esc(v.wrong)}`},
    autoplay(q,v){
      const ok=q.options.find(o=>o.ok).t;
      if(v.kind==='verb'){ const f=q.form||ok; return {text:f,key:au(f)}; }
      if(v.kind==='biz') return {text:v.say,key:au(v.say)};
      const r=v.right.replace(/（.*?）/,''); return {text:r,key:au(r)};
    },
  };
}

/* ---------------- Ngữ pháp JLPT N2/N3: nhóm nghĩa, mục lục + sơ đồ tư duy ---------------- */
if(MODULE==='grammar-n2' || MODULE==='grammar-n3'){
  const LV = MODULE==='grammar-n3' ? 'N3' : 'N2', MAPKEY = LV==='N2' ? 'n2map' : 'n3map';
  const LESSONS=[...new Set(DATA.map(v=>v.bai))];
  // bài chuyên đề (sau 14 bài theo sơ đồ) có tên riêng
  // bài = nhóm nghĩa; tên nhóm (v.gn, v.gja) và lời giới thiệu (v.gd) đi kèm dữ liệu
  const G = Object.fromEntries(LESSONS.map(b=>{ const v=DATA.find(x=>x.bai===b); return [b,{n:v.gn,ja:v.gja,d:v.gd}]; }));
  const lname = b => (G[b]&&G[b].n) || 'Bài '+b;
  const groups=LESSONS.map(b=>({k:String(b),label:lname(b)}));
  const core = p => p.replace(/[〜~（）()\s]/g,'');
  // mẫu cùng hình thức / gần nghĩa (khai báo hai chiều) không được làm đáp án nhiễu của nhau
  const simOf = Object.fromEntries(DATA.map(v=>[v.id,new Set([v.id,...(v.similar||[])])]));
  for(const v of DATA) for(const o of v.similar||[]) if(simOf[o]) simOf[o].add(v.id);
  const distract = (v, pool, key, exclude=()=>false) => {
    const ok = o => !simOf[v.id].has(o.id) && core(o.p)!==core(v.p) && o[key]!==v[key] && !exclude(o);
    let d = pickN(pool.filter(ok).map(o=>o[key]),3,[v[key]]);
    if(d.length<3) d=d.concat(pickN(DATA.filter(ok).map(o=>o[key]),3-d.length,[v[key],...d]));
    return d;
  };
  const exLine = e => `<div class="ex"><div class="j jp">${rb(e.ja, e.hit?[[e.hit[0],e.hit[1],'mark']]:[])} ${spk(e.ja,e.au)}</div><div class="v">${esc(e.vi)}</div></div>`;
  // withM: phần giải thích cần nhắc lại nghĩa; trong sơ đồ nghĩa đã nằm ngay cạnh mẫu
  const noteHTML = (v, withM=true) => (v.kt||withM ? `<dl class="gnote">${v.kt?`<dt>Cấu trúc</dt><dd class="jp">${esc(v.kt)}</dd>`:''}${withM?`<dt>Nghĩa</dt><dd>${esc(v.m)}</dd>`:''}</dl>` : '')
    + (v.note?`<p class="mm-note">${esc(v.note)}</p>`:'');
  MODULES[MODULE] = {
    key:MODULE, exam:'JLPT '+LV, name:'Ngữ pháp '+LV, title:'Ôn tập ngữ pháp '+LV, quizTitle:'Kiểm tra ngữ pháp '+LV, unit:'mẫu',
    items: DATA,
    groupTitle:'Chọn nhóm', groupSub:`${DATA.length} mẫu ngữ pháp ${LV} chia theo ${LESSONS.length} nhóm nghĩa. Mỗi lượt tối đa 20 câu.`, wideGroups:true,
    groups, groupOf: v=>String(v.bai),
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn']],
    select: k => k==='all'?groups.map(g=>g.k) : k==='none'?[] : groups.filter(g=>{ const [a,b]=k.split('-').map(Number); return +g.k>=a&&+g.k<=b; }).map(g=>g.k),
    types:[
      {k:'dien', label:'Điền mẫu · 文法', name:'Điền mẫu vào câu', desc:'Chọn mẫu ngữ pháp hợp với chỗ trống trong câu ví dụ'},
      {k:'nghia', label:'Ý nghĩa · 意味', name:'Chọn nghĩa', desc:'Mẫu ngữ pháp → nghĩa tiếng Việt'},
      {k:'sao', label:'Sắp xếp ★ · 並べ替え', name:'Sắp xếp câu ★', desc:'Xếp 4 mảnh thành câu đúng, chọn mảnh ở ô ★ (dạng đề JLPT)'},
    ],
    canDo: (t,v) => t==='nghia' ? !!v.m : t==='sao' ? !!(v.star&&v.star.parts&&v.star.parts.length===4) : v.ex.some(e=>e.hit),
    build(t,v,pool){
      if(t==='sao'){ const st=v.star, slot=k=>`<span class="blank star-slot">${k===2?'★':'&emsp;'}</span>`;
        return {ask:'Sắp xếp 4 mảnh thành câu đúng. Mảnh nào nằm ở ô ★?', star:st, optClass:'long',
          stem:`<div class="sent jp">${esc(st.pre)}${[0,1,2,3].map(slot).join(' ')}${esc(st.post)}</div>
            <div class="tr hint hidden">${esc(st.vi)}</div><button class="mini" data-reveal>Gợi ý: xem bản dịch</button>`,
          options: shuffle(st.parts.map((x,k)=>({t:x,ok:k===2})))}; }
      if(t==='nghia') return {ask:'Mẫu ngữ pháp này có nghĩa là gì?', stem:`<div class="bigword jp">${esc(v.p)}</div>`,
        optClass:'vi', options: shuffle([{t:v.m,ok:true},...distract(v,pool,'m').map(x=>({t:x,ok:false}))])};
      const exs=v.ex.filter(e=>e.hit), e=exs[Math.random()*exs.length|0], [a,b]=e.hit;
      // không đưa mẫu nhiễu có chữ đã nằm sẵn trong câu (vd 〜上 khi câu đã có 上)
      const d = distract(v,pool,'p', o=>e.ja.includes(core(o.p).split(/[／・/]/)[0]));
      return {ask:'Chọn mẫu ngữ pháp thích hợp điền vào chỗ trống.', ex:e,
        stem:`<div class="sent jp">${esc(e.ja.slice(0,a))}<span class="blank">&emsp;&emsp;</span>${esc(e.ja.slice(b))}</div>
          <div class="tr hint hidden">${esc(e.vi)}</div><button class="mini" data-reveal>Gợi ý: xem bản dịch</button>`,
        options: shuffle([{t:v.p,ok:true},...d.map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      const exs = q.ex ? [q.ex, ...v.ex.filter(e=>e!==q.ex)] : v.ex;
      // câu ★: hiện cả câu đúng thứ tự, đánh số 1–4 từng mảnh, mảnh ★ tô vàng
      const starHTML = q.star ? `<div class="ex star-ans"><div class="j jp">${esc(q.star.pre)}${q.star.parts.map((x,k)=>`<span class="sp${k===2?' on':''}"><i>${k===2?'★':k+1}</i>${esc(x)}</span>`).join('')}${esc(q.star.post)}</div><div class="v">${esc(q.star.vi)}</div></div>` : '';
      return `<div class="explain ${right?'':'wrong'}"><div class="w jp">${esc(v.p)} <small>${lname(v.bai)} · ${String(v.n).padStart(2,'0')}</small></div>
        ${starHTML}${noteHTML(v)}${exs.map(exLine).join('')}</div>`;
    },
    summary: v => ({title:esc(v.p), sub:`${esc(v.m)} · ${lname(v.bai)}`}),
  };
  // sơ đồ tư duy ở đầu trang: mỗi bài một nhánh, bấm mẫu để mở cấu trúc + ví dụ
  // 16 nhóm gom vào 5 khối lớn cho mục lục (số = nhóm trong dữ liệu, v.bai)
  // khối lấy từ dữ liệu (v.bk, v.bkn, v.bkja) nếu có; N2 cũ dùng danh sách dưới
  const BLOCKS = DATA[0].bk ? [...new Map(DATA.map(v=>[v.bk,{k:v.bk,n:v.bkn,ja:v.bkja,g:[...new Set(DATA.filter(x=>x.bk===v.bk).map(x=>x.bai))]}])).values()] : [
    {k:'time', n:'Thời gian', ja:'時', g:[1,2]},
    {k:'cause', n:'Nguyên nhân – kết quả', ja:'因', g:[3,4,5]},
    {k:'scope', n:'Đối chiếu – phạm vi', ja:'対', g:[6,7,8,9,10]},
    {k:'stance', n:'Nhận định – thái độ', ja:'判', g:[11,12,13,14,15]},
    {k:'voice', n:'Sai khiến – bị động', ja:'使', g:[16]},
  ].map(bl=>({...bl, g:bl.g.filter(b=>LESSONS.includes(b))})).filter(bl=>bl.g.length);
  { const listed=BLOCKS.flatMap(bl=>bl.g), rest=LESSONS.filter(b=>!listed.includes(b)); if(rest.length) BLOCKS.push({k:'other', n:'Khác', ja:'他', g:rest}); }
  let mapBai = null, open = null;
  MODULES[MODULE].groupsInMap = true;   // chọn nhóm để ôn bằng ô tick trong mục lục, ẩn khung "Chọn nhóm" chung
  MODULES[MODULE].renderMap = () => {
    if(mapBai===null){ mapBai=+store.get(MAPKEY, LESSONS[0]); if(!LESSONS.includes(mapBai)) mapBai=LESSONS[0]; }  // store có sau khi app.js chạy
    document.body.classList.add('mm-wide');
    const P=$('#mapPanel'); P.classList.remove('hidden');
    const items=DATA.filter(v=>v.bai===mapBai), cur=BLOCKS.find(bl=>bl.g.includes(mapBai));
    const ticked=prefs.groups.filter(g=>LESSONS.includes(+g));
    const row = b => { const vs=DATA.filter(v=>v.bai===b), known=vs.filter(v=>stats[v.id]&&stats[v.id].c>0).length;
      return `<div class="mm-item ${b===mapBai?'on':''}"><label class="mm-tick" title="Chọn để ôn"><input type="checkbox" data-mm-tick="${b}" ${prefs.groups.includes(String(b))?'checked':''}></label>
        <button class="mm-name" data-mm-bai="${b}"><i>${b}</i><span>${esc(lname(b))} <small>${vs.length}</small></span><em><b style="width:${known/vs.length*100}%"></b></em></button></div>`; };
    P.innerHTML = `<h2>Mục lục · sơ đồ tư duy</h2><p class="sub">Chọn nhóm ở mục lục để xem sơ đồ; tick các nhóm muốn ôn rồi bấm “Ôn các nhóm đã chọn”. Bấm vào một mẫu để xem cấu trúc và câu ví dụ.</p>
      <div class="mm-layout">

          <div class="mm"><div class="mm-root"><span>NHÓM</span><b>${mapBai}</b></div>
            <ol class="mm-list">${items.map((v,i)=>`<li class="mm-row c${i%6} ${open===v.id?'open':''}">
              <button class="mm-node" data-mm="${v.id}" aria-expanded="${open===v.id}"><span class="mm-n">${String(v.n).padStart(2,'0')}</span><span class="mm-p jp">${esc(v.p)}</span><span class="mm-m">${esc(v.m)}</span></button>
              ${open===v.id?`<div class="mm-detail">${v.ex.length?`<div class="mm-tools">${rubyBtn()}</div>`:''}${noteHTML(v,false)}${v.ex.map(exLine).join('')||'<p class="mm-note">Chưa có câu ví dụ.</p>'}</div>`:''}</li>`).join('')}</ol></div>
          <div class="row mm-go"><button class="btn" data-mm-go="${mapBai}">Ôn nhóm này · ${items.length} mẫu</button></div>
        </div>
      </div>`;
    { const on=P.querySelector('.mm-blocks .on'), bar=on&&on.parentNode; if(on && bar.scrollWidth>bar.clientWidth) bar.scrollLeft = on.offsetLeft - bar.offsetLeft - (bar.clientWidth - on.offsetWidth)/2; }
    const start = gs => { prefs.groups=gs.map(String); renderSetup(); startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode)); };
    P.onchange = e => { const t=e.target.closest('[data-mm-tick]'); if(!t) return; const g=t.dataset.mmTick;
      prefs.groups = t.checked ? [...new Set([...prefs.groups,g])] : prefs.groups.filter(x=>x!==g); renderSetup(); };
    P.onclick = e => {
      const b=e.target.closest('[data-mm],[data-mm-bai],[data-mm-go],[data-mm-ticked]'); if(!b) return;
      if(b.dataset.mmBai){ mapBai=+b.dataset.mmBai; open=null; store.set(MAPKEY,mapBai); MODULES[MODULE].renderMap(); }
      else if(b.dataset.mm){ open = open===b.dataset.mm ? null : b.dataset.mm; MODULES[MODULE].renderMap(); }
      else if(b.dataset.mmGo){ start([b.dataset.mmGo]); }
      else if(b.dataset.mmTicked!==undefined){ start(ticked); }
    };

}
/* ===================== shared engine ===================== */
const N_Q = 20;
const MODES = [{k:'weak',label:'Ưu tiên câu yếu'},{k:'rand',label:'Ngẫu nhiên'},{k:'order',label:'Theo thứ tự'}];

const store = {
  get(k,d){ try{ const v=localStorage.getItem('bjtvocab:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bjtvocab:'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pickN = (list, n, exclude) => { const seen=new Set(exclude); const out=[]; for(const x of shuffle(list)){ if(out.length>=n) break; if(!x||seen.has(x)) continue; seen.add(x); out.push(x);} return out; };

// nút ルビ: bật/tắt furigana trên câu ví dụ, nhớ lựa chọn cho mọi trang (lớp noruby đặt sớm trong shell.html)
const rubyOn = () => !document.documentElement.classList.contains('noruby');
const rubyBtn = () => `<button class="rubybtn ${rubyOn()?'on':''}" data-ruby aria-pressed="${rubyOn()}" title="Bật/tắt furigana">ルビ</button>`;
const M = MODULES[MODULE];
const ITEMS = M.items;
const byId = Object.fromEntries(ITEMS.map(v=>[v.id,v]));
let stats = store.get('stats', {});
let prefs = Object.assign({groups:M.defaultGroups||[M.groups[0].k], types:M.types.map(t=>t.k), mode:'weak', instant:true, order:{}},
                          store.get('prefs:'+M.key, {}));
prefs.groups = prefs.groups.filter(g=>M.groups.some(x=>x.k===g));
// ?nhom=N (e.g. from the listening page) preselects one lesson/group
{ const g=new URLSearchParams(location.search).get('nhom'); if(g && M.groups.some(x=>x.k===g)) prefs.groups=[g]; }
// modules with sets (vocab: 2200 / 600): one set is shown at a time, and only its groups stay selected
if(M.sets){ const open=M.sets.filter(s=>s.count); if(!open.some(s=>s.k===prefs.set)) prefs.set=open[0].k;
  const g0=prefs.groups.find(g=>M.setOfGroup(g)); if(g0) prefs.set=M.setOfGroup(g0);
  prefs.groups=prefs.groups.filter(g=>M.setOfGroup(g)===prefs.set); if(!prefs.groups.length) prefs.groups=[M.groups.find(g=>g.set===prefs.set).k]; }
prefs.types = prefs.types.filter(t=>M.types.some(x=>x.k===t));
if(!prefs.types.length) prefs.types=M.types.map(t=>t.k);
const savePrefs = () => store.set('prefs:'+M.key, prefs);

/* ---------- audio: pre-recorded Tokyo voice (ja-JP-NanamiNeural) in audio/, browser voice as fallback ---------- */
const player = new Audio();
function speakTTS(text){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
}
function say(text, key){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(!key){ speakTTS(text); return; }
  player.onerror=()=>speakTTS(text);
  player.src='audio/'+key+'.mp3';
  player.play().catch(err=>{ if(err.name!=='AbortError' && err.name!=='NotAllowedError') speakTTS(text); });
}
const spk = (text, key) => `<button class="speak" data-say="${esc(text)}"${key?` data-audio="${esc(key)}"`:''} title="Nghe">🔊</button>`;

/* ---------- session ---------- */
let S=null, timerId=null;
const poolFor = groups => ITEMS.filter(v=>groups.includes(M.groupOf(v)));
function chooseItems(pool, types, mode){
  const usable=pool.filter(v=>types.some(t=>M.canDo(t,v)));
  if(mode==='order'){
    const key=prefs.groups.slice().sort().join(',');
    let start=(prefs.order&&prefs.order[key])||0;
    if(start>=usable.length) start=0;
    const pick=usable.slice(start,start+N_Q);
    if(pick.length<N_Q) pick.push(...usable.slice(0,Math.min(N_Q,usable.length)-pick.length));
    prefs.order=prefs.order||{}; prefs.order[key]=start+N_Q>=usable.length?0:start+N_Q; savePrefs();
    return pick;
  }
  if(mode==='weak'){
    const score=v=>{ const s=stats[v.id]; if(!s) return 1000+Math.random()*100;
      const days=(Date.now()-(s.t||0))/864e5;
      return s.w*40 - s.c*15 + Math.min(days,30)*2 + Math.random()*25; };
    return usable.map(v=>[score(v),v]).sort((a,b)=>b[0]-a[0]).slice(0,N_Q).map(x=>x[1]);
  }
  return shuffle(usable).slice(0,N_Q);
}
function startSession(items){
  const pool=poolFor(prefs.groups);
  const types=prefs.types;
  const qs=shuffle(items).map((v,i)=>{
    const ok=types.filter(t=>M.canDo(t,v));
    const pref=types[i%types.length];
    const t= ok.includes(pref) ? pref : ok[Math.random()*ok.length|0];
    return Object.assign(M.build(t,v,pool), {type:t, id:v.id});
  });
  S={qs, ans:Array(qs.length).fill(null), cur:0, start:Date.now(), done:false, instant:prefs.instant};
  show('quiz'); render();
  clearInterval(timerId); timerId=setInterval(tick,1000); tick();
}
function tick(){
  if(!S) return;
  const sec=Math.floor(((S.end||Date.now())-S.start)/1000);
  $('#timer').textContent=String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
const locked = i => S.done || (S.instant && S.ans[i]!==null);
const typeOf = k => M.types.find(t=>t.k===k);
const LETTERS='ABCD';
function render(){
  const q=S.qs[S.cur], i=S.cur, n=S.qs.length;
  const state = k => S.ans[k]===null ? '' : locked(k) ? (S.qs[k].options[S.ans[k]].ok?'ok':'bad') : 'ans';
  $('#nav').innerHTML=S.qs.map((qq,k)=>`<button class="sq ${state(k)} ${k===i?'cur':''}" data-go="${k}">${k+1}</button>`).join('');
  { const nav=$('#nav'), sq=nav.children[i]; if(sq && nav.scrollWidth>nav.clientWidth) nav.scrollLeft = sq.offsetLeft - nav.offsetLeft - nav.clientWidth/2 + sq.offsetWidth/2; }
  $('#seg').innerHTML=S.qs.map((qq,k)=>`<i class="${state(k)} ${k===i?'cur':''}"></i>`).join('');
  $('#posNum').textContent=i+1; $('#posTotal').textContent=n;
  const done=S.qs.map((qq,k)=>state(k));
  $('#mOk').textContent=done.filter(x=>x==='ok').length;
  $('#mBad').textContent=done.filter(x=>x==='bad').length;
  $('#qn').textContent=`#${i+1}`;
  $('#qtype').textContent=typeOf(q.type).label;
  $('#ask').textContent=q.ask;
  const lk=locked(i);
  $('#stem').innerHTML=q.stem;
  // short options (readings, words) sit in a 2x2 grid; sentences and Vietnamese meanings stay in a list
  const short = !(q.optClass||'').match(/vi|long/) && q.options.every(o=>o.t.length<=14);
  $('#opts').className = 'opts' + (short?' grid2':'');
  $('#opts').innerHTML=q.options.map((o,k)=>{
    let c='opt';
    if(lk){ if(o.ok) c+=' ok'; else if(S.ans[i]===k) c+=' bad'; }
    else if(S.ans[i]===k) c+=' sel';
    return `<button class="${c}" data-opt="${k}" ${lk?'disabled':''}><span class="n">${LETTERS[k]}</span><span class="t ${q.optClass||'jp'}">${esc(o.t)}</span></button>`;
  }).join('');
  const right = S.ans[i]!==null && q.options[S.ans[i]].ok;
  const ex = lk ? M.explain(q, byId[q.id], right) : '';
  $('#explain').innerHTML = lk ? ex.replace(/^(<div class="explain[^>]*>)/, `$1<div class="verdict"><span>${S.ans[i]===null?'Chưa trả lời':right?'✓ Chính xác':'✗ Chưa đúng'}</span>${ex.includes('<ruby>')?rubyBtn():''}</div>`) : '';
  $('#prevBtn').disabled = i===0;
  const last = i===n-1;
  $('#nextBtn').textContent = S.done ? (last?'Xem kết quả':'Câu tiếp →') : (last?'Nộp bài':'Câu tiếp →');
  $('#submitBtn').classList.toggle('hidden', S.done);
}
function choose(k){
  const i=S.cur; if(locked(i) || k>=S.qs[i].options.length) return;
  S.ans[i]=k;
  if(S.instant) record(S.qs[i], k);
  render();
}
function record(q,k){
  const s=stats[q.id]||{c:0,w:0,t:0};
  if(q.options[k].ok) s.c++; else s.w++;
  s.t=Date.now(); stats[q.id]=s; store.set('stats',stats);
}
function go(i){ if(!S||i<0||i>=S.qs.length) return; S.cur=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function next(){
  if(S.cur<S.qs.length-1) return go(S.cur+1);
  if(S.done) return showResult();
  const blank=S.ans.filter(a=>a===null).length;
  if(blank && !confirm(`Còn ${blank} câu chưa trả lời. Nộp bài luôn?`)) return;
  finish();
}
function submitNow(){
  const blank=S.ans.filter(a=>a===null).length;
  if(!confirm(blank?`Còn ${blank} câu chưa trả lời. Nộp bài luôn?`:'Nộp bài?')) return;
  finish();
}
function finish(){
  if(!S.instant) S.qs.forEach((q,i)=>{ if(S.ans[i]!==null) record(q,S.ans[i]); });
  S.done=true; S.end=Date.now(); clearInterval(timerId); tick();
  showResult();
}
let rFilter='all';
function showResult(){
  show('result');
  const total=S.qs.length, ok=S.qs.filter((q,i)=>S.ans[i]!==null&&q.options[S.ans[i]].ok).length;
  const pct=Math.round(ok/total*100);
  const sec=Math.floor((S.end-S.start)/1000);
  $('#scoreBox').innerHTML=`
    <div class="bignum">${ok}<small> / ${total}</small></div>
    <div><h2>${pct>=80?'Tuyệt vời!':pct>=50?'Khá ổn!':'Cố gắng thêm nhé!'}</h2>
    <p>Đúng ${pct}% · Thời gian ${sec/60|0} phút ${sec%60} giây</p>
    <div class="scorebar"><i style="width:${pct}%"></i></div>
    <p style="font-size:12.5px;color:var(--muted)">Bấm vào từng câu bên dưới để xem lại.</p></div>`;
  $('#retryWrong').disabled = ok===total;
  $('#rfilters').innerHTML=[['all','Tất cả'],['bad','Câu sai'],['ok','Câu đúng']].map(([k,l])=>`<button class="pill ${rFilter===k?'on':''}" data-rf="${k}">${l}</button>`).join('');
  $('#rlist').innerHTML=S.qs.map((q,i)=>{
    const v=byId[q.id]; const a=S.ans[i]; const good=a!==null&&q.options[a].ok;
    if(rFilter==='bad'&&good) return ''; if(rFilter==='ok'&&!good) return '';
    const sm=M.summary(v);
    return `<div class="ritem" data-review="${i}"><span class="mk ${good?'ok':'bad'}">${good?'✓':'✗'}</span>
      <div><div class="w jp">${sm.title}</div>
      <div class="m">${sm.sub} · <span style="color:var(--muted)">${typeOf(q.type).name}</span></div>
      ${good?'':`<div class="yours">Bạn chọn: ${a===null?'(bỏ trống)':esc(q.options[a].t)} → Đáp án: ${esc(q.options.find(o=>o.ok).t)}</div>`}</div></div>`;
  }).join('') || '<p class="stat">Không có câu nào.</p>';
}

/* ---------- setup ---------- */
function show(id){
  ['setup','quiz','result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));
  $('#backLbl').textContent = id==='setup' ? 'Trang chủ' : id==='quiz' ? 'Thoát' : 'Chọn lại';
  $('#title').textContent = id==='setup'?M.title:id==='quiz'?M.quizTitle:'Kết quả';
  window.scrollTo(0,0);
}
function renderSetup(){
  if(M.renderMap) M.renderMap();
  $('#lessons').closest('.panel').classList.toggle('hidden', !!M.groupsInMap);
  const set = M.sets && M.sets.find(s=>s.k===prefs.set);
  if(set) $('#sets').innerHTML=M.sets.map(s=>s.count
    ? `<button class="stab ${s.k===set.k?'on':''}" data-set="${s.k}">${s.label}<small>${s.note||s.count+' từ'}</small></button>`
    : `<button class="stab soon" disabled>${s.label}<small>更新中</small></button>`).join('');
  $('#sets').classList.toggle('hidden', !set);
  const on = $('#sets .stab.on'); if(on) on.parentNode.scrollLeft = on.offsetLeft - on.parentNode.offsetLeft - (on.parentNode.clientWidth - on.offsetWidth)/2;
  $('#groupTitle').textContent=M.groupTitle;
  $('#groupSub').textContent=set ? set.sub : M.groupSub;
  $('#quick').innerHTML=M.quick.concat(set ? set.quick : []).map(([k,l])=>`<button class="mini" data-sel="${k}">${l}</button>`).join('');
  $('#lessons').className = M.wideGroups ? 'lessons wide' : 'lessons';
  $('#lessons').innerHTML=M.groups.filter(g=>!set || g.set===set.k).map(g=>{
    const ws=ITEMS.filter(v=>M.groupOf(v)===g.k); const known=ws.filter(v=>stats[v.id]&&stats[v.id].c>0).length;
    return `<button class="lchip ${prefs.groups.includes(g.k)?'on':''}" data-l="${g.k}"><b>${g.label}</b><small>${known}/${ws.length}</small><div class="bar"><i style="width:${known/ws.length*100}%"></i></div></button>`;
  }).join('');
  $('#types').innerHTML=M.types.map(t=>`<button class="tcard ${prefs.types.includes(t.k)?'on':''}" data-t="${t.k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
  $('#modes').innerHTML=MODES.map(m=>`<button class="pill ${prefs.mode===m.k?'on':''}" data-m="${m.k}">${m.label}</button>`).join('');
  $('#instant').checked=prefs.instant;
  const pool=poolFor(prefs.groups).filter(v=>prefs.types.some(t=>M.canDo(t,v)));
  const seen=pool.filter(v=>stats[v.id]).length, weak=pool.filter(v=>stats[v.id]&&stats[v.id].w>stats[v.id].c).length;
  $('#poolStat').innerHTML=`<b>${pool.length}</b> ${M.unit} · đã ôn <b>${seen}</b> · hay sai <b>${weak}</b>`;
  $('#startBtn').textContent=`Bắt đầu ${Math.min(N_Q,pool.length)} câu`;
  $('#startBtn').disabled = pool.length<1 || !prefs.types.length;
  savePrefs();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-review]'); if(!t) return;
  const d=t.dataset;
  if(d.l!==undefined){ const l=d.l; prefs.groups=prefs.groups.includes(l)?prefs.groups.filter(x=>x!==l):[...prefs.groups,l]; renderSetup(); }
  else if(d.sel){ prefs.groups = M.select(d.sel, prefs.set); renderSetup(); }
  else if(d.set){ if(d.set!==prefs.set){ prefs.set=d.set; prefs.groups=[M.groups.find(g=>g.set===d.set).k]; } renderSetup(); }
  else if(d.t){ prefs.types=prefs.types.includes(d.t)?prefs.types.filter(x=>x!==d.t):[...prefs.types,d.t]; renderSetup(); }
  else if(d.m){ prefs.mode=d.m; renderSetup(); }
  else if(d.go!==undefined){ go(+d.go); }
  else if(d.opt!==undefined){ choose(+d.opt); }
  else if(d.say){ say(d.say, d.audio); }
  else if(d.ruby!==undefined){ document.documentElement.classList.toggle('noruby'); store.set('ruby',rubyOn());
    document.querySelectorAll('[data-ruby]').forEach(b=>{ b.classList.toggle('on',rubyOn()); b.setAttribute('aria-pressed',rubyOn()); }); }
  else if(d.reveal!==undefined){ document.querySelectorAll('#stem .tr').forEach(x=>x.classList.remove('hidden')); t.remove(); }
  else if(d.rf){ rFilter=d.rf; showResult(); }
  else if(d.review!==undefined){ show('quiz'); go(+d.review); }
});
$('#instant').addEventListener('change',e=>{ prefs.instant=e.target.checked; savePrefs(); });
$('#startBtn').onclick=()=>startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode));
$('#prevBtn').onclick=()=>go(S.cur-1);
$('#nextBtn').onclick=next;
$('#submitBtn').onclick=submitNow;
// question strip (phone layout): mouse wheel scrolls it sideways, and it can be dragged with the mouse
{ const nav=$('#nav'); let drag=null;
  nav.addEventListener('wheel',e=>{ if(nav.scrollWidth<=nav.clientWidth || Math.abs(e.deltaX)>Math.abs(e.deltaY)) return; nav.scrollLeft+=e.deltaY; e.preventDefault(); },{passive:false});
  nav.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||nav.scrollWidth<=nav.clientWidth) return; drag={x:e.clientX,left:nav.scrollLeft,moved:false}; });
  window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>4){ drag.moved=true; nav.classList.add('dragging'); } nav.scrollLeft=drag.left-dx; });
  // swallow only the click that ends a drag; drop the guard right after in case that click never fires
  const swallow=e=>{ e.stopPropagation(); e.preventDefault(); };
  window.addEventListener('pointerup',()=>{ if(drag&&drag.moved){ nav.addEventListener('click',swallow,{capture:true,once:true}); setTimeout(()=>nav.removeEventListener('click',swallow,{capture:true}),0); } drag=null; nav.classList.remove('dragging'); });
}
$('#newRound').onclick=()=>{ rFilter='all'; startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode)); };
$('#retryWrong').onclick=()=>{ rFilter='all'; startSession(S.qs.filter((q,i)=>!(S.ans[i]!==null&&q.options[S.ans[i]].ok)).map(q=>byId[q.id])); };
$('#toSetup').onclick=()=>{ renderSetup(); show('setup'); };
$('#backBtn').onclick=()=>{
  if(!$('#setup').classList.contains('hidden')){ location.href='index.html'; return; }
  if(!$('#quiz').classList.contains('hidden') && S && !S.done && S.ans.some(a=>a!==null) && !confirm('Thoát bài đang làm?')) return;
  clearInterval(timerId); renderSetup(); show('setup');
};
$('#resetBtn').onclick=()=>{
  if(!confirm(`Xoá lịch sử ôn tập phần ${M.name} trên trình duyệt này?`)) return;
  for(const v of ITEMS) delete stats[v.id];
  store.set('stats',stats); renderSetup();
};
$('#themeBtn').onclick=()=>{
  const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark'; store.set('theme',r.dataset.theme);
};
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hidden')||!S) return;
  if(e.target.tagName==='INPUT') return;
  if(/^[1-9]$/.test(e.key)) choose(+e.key-1);
  else if(/^[a-dA-D]$/.test(e.key)) choose('abcd'.indexOf(e.key.toLowerCase()));
  else if(e.key==='ArrowRight'||e.key==='Enter') next();
  else if(e.key==='ArrowLeft') go(S.cur-1);
});
document.title = M.title + ' ' + (M.exam||'BJT');
renderSetup();

</script>
