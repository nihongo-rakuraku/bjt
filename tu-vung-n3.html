set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"交流","r":"こうりゅう","m":"giao lưu","en":"exchange, interaction","s":true,"ex":[["インターネットのおかげで、外国の人とも簡単に交流できるようになった。","Nhờ internet, giao lưu với người nước ngoài cũng trở nên dễ dàng."]],"au":"t/6b105189843a","eau":["t/6c28edc62488"]},{"id":"n3v-x0098","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"味方","r":"みかた","m":"đồng minh, phe mình","en":"ally, supporter","s":true,"ex":[["母はいつも子どもの味方で、父に叱られるとかばってくれた。","Mẹ lúc nào cũng đứng về phía con cái, hễ bị bố mắng là mẹ bênh."]],"au":"t/b84fcc813814","eau":["t/ca31e1e72545"]},{"id":"n3v-x0099","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"同僚","r":"どうりょう","m":"đồng nghiệp","en":"colleague","s":false,"ex":[["同じ部署の同僚が病気で休んだので、彼の仕事も私がやった。","Đồng nghiệp cùng phòng nghỉ ốm nên tôi làm luôn phần việc của anh ấy."]],"au":"t/c543e826f6df","eau":["t/40ad74997a0a"]},{"id":"n3v-x0100","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"先輩","r":"せんぱい","m":"tiền bối, đàn anh/chị","en":"senior","s":false,"ex":[["大学の先輩の紹介で、今の会社に入った。","Tôi vào công ty hiện tại nhờ đàn anh cùng trường đại học giới thiệu."]],"au":"t/67f74db94315","eau":["t/4ade336c4cfc"]},{"id":"n3v-x0101","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"後輩","r":"こうはい","m":"đàn em, hậu bối","en":"junior","s":false,"ex":[["今年は部活に後輩が五人も入ってきた。","Năm nay có tận năm đàn em vào câu lạc bộ."]],"au":"t/08f5297108c9","eau":["t/9304d453af10"]},{"id":"n3v-x0102","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"喧嘩","r":"けんか","m":"cãi nhau, đánh nhau","en":"quarrel, fight","s":true,"ex":[["駅前で酔った男たちが喧嘩をしていて、警察が来た。","Mấy gã say rượu đánh nhau trước ga khiến cảnh sát phải đến."]],"au":"t/0023d4b31225","eau":["t/f375b4443726"]},{"id":"n3v-x0103","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"仲直り","r":"なかなおり","m":"làm lành, hòa giải","en":"reconciliation, making up","s":true,"ex":[["彼女と仲直りしたくて、好きなケーキを買って会いに行った。","Muốn làm lành với bạn gái, tôi mua chiếc bánh cô ấy thích rồi đến gặp."]],"au":"t/d2e34b000792","eau":["t/bb85a4683f70"]},{"id":"n3v-x0104","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"quanhe","tn":"Gặp gỡ & quan hệ","tja":"出会い・人間関係","gl":"Gặp gỡ & quan hệ 3","l":6,"w":"励ます","r":"はげます","m":"động viên, khích lệ","en":"to encourage","s":false,"ex":[["試験に落ちて元気のない友達を励ます言葉が見つからなかった。","Tôi không tìm được lời nào để động viên người bạn đang buồn vì thi trượt."]],"au":"t/569ee21092cc","eau":["t/5f82de18c066"]},{"id":"n3v-x0105","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"マナー","r":"","m":"cách cư xử đúng mực","en":"manners","s":false,"ex":[["電車の中で大声で電話するなんて、マナーが悪い人だ。","Gọi điện to tiếng trên tàu thì đúng là người kém ý thức."]],"au":"t/9a459cea045e","eau":["t/0c591a4cdf3c"]},{"id":"n3v-x0106","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"エチケット","r":"","m":"phép xã giao (ý tứ)","en":"etiquette","s":false,"ex":[["せきが出るときはマスクをつけるという「せきエチケット」を守ろう。","Hãy giữ \"phép lịch sự khi ho\": đeo khẩu trang khi bị ho."]],"au":"t/9ae0977bb9f2","eau":["t/d82ccac225f6"]},{"id":"n3v-x0107","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"ルール","r":"","m":"luật lệ, quy tắc","en":"rule","s":false,"ex":[["ごみの出し方には、地域ごとにルールがある。","Cách đổ rác có quy tắc riêng tùy từng khu vực."]],"au":"t/fafa32e8be5b","eau":["t/694140f9c303"]},{"id":"n3v-x0108","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"順番","r":"じゅんばん","m":"thứ tự, lượt","en":"order, turn","s":false,"ex":[["病院では、受付の順番に名前を呼ばれる。","Ở bệnh viện, người ta gọi tên theo thứ tự đăng ký."]],"au":"t/c17dd3adb49f","eau":["t/f1a4d358bea0"]},{"id":"n3v-x0109","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"割り込む","r":"わりこむ","m":"chen ngang","en":"cut in (line)","s":false,"ex":[["列に割り込む人がいて、並んでいた人たちが怒っていた。","Có người chen ngang hàng khiến những người đang xếp hàng tức giận."]],"au":"t/2b7f57c5a0a9","eau":["t/2bc4226ea9a9"]},{"id":"n3v-x0110","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"遅刻","r":"ちこく","m":"đến muộn","en":"being late","s":true,"ex":[["寝坊して、大事な会議に遅刻してしまった。","Tôi ngủ quên nên đến muộn buổi họp quan trọng."]],"au":"t/ab03839588db","eau":["t/15d7b03bac71"]},{"id":"n3v-x0111","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"失礼","r":"しつれい","m":"thất lễ","en":"rudeness","s":true,"ex":[["人が話している途中で帰るのは失礼だ。","Bỏ về khi người khác đang nói là bất lịch sự."]],"au":"t/132538fefa9e","eau":["t/849b589a28c5"]},{"id":"n3v-x0112","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"無視","r":"むし","m":"phớt lờ","en":"ignore","s":true,"ex":[["あいさつをしたのに、彼に無視された。","Tôi chào mà bị anh ta phớt lờ."]],"au":"t/b1ee496182ab","eau":["t/114fa8a6f046"]},{"id":"n3v-x0113","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"お辞儀","r":"おじぎ","m":"cúi chào","en":"bow","s":true,"ex":[["日本のお辞儀は、相手や場面によって頭を下げる角度が変わる。","Kiểu cúi chào của Nhật thay đổi độ cúi đầu tùy người và hoàn cảnh."]],"au":"t/12f91952ee00","eau":["t/b000735e3507"]},{"id":"n3v-x0114","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"礼","r":"れい","m":"cúi đầu chào (theo hiệu lệnh)","en":"bow, salute","s":false,"ex":[["日直が「起立、礼」と号令をかけて、授業が始まった。","Học sinh trực nhật hô \"Đứng dậy, chào!\" rồi giờ học bắt đầu."]],"au":"t/0754a262e6a3","eau":["t/685c839629b3"]},{"id":"n3v-x0115","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"礼儀正しい","r":"れいぎただしい","m":"lễ phép","en":"polite, courteous","s":false,"ex":[["あの店の店員はみんな礼儀正しいので、気持ちがいい。","Nhân viên cửa hàng đó ai cũng lễ phép nên rất dễ chịu."]],"au":"t/4b3215fa2705","eau":["t/1c29009e22a9"]},{"id":"n3v-x0116","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"敬う","r":"うやまう","m":"kính trọng","en":"respect, revere","s":false,"ex":[["お年寄りを敬う気持ちを忘れてはいけない。","Không được quên lòng kính trọng người già."]],"au":"t/003239cef1ea","eau":["t/eac6883f9eb1"]},{"id":"n3v-x0117","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"上下関係","r":"じょうげかんけい","m":"quan hệ trên dưới","en":"hierarchy","s":false,"ex":[["この部活は上下関係が厳しく、先輩の言うことは絶対だ。","Câu lạc bộ này trên dưới nghiêm ngặt, lời đàn anh là tuyệt đối."]],"au":"t/2654634ffbbe","eau":["t/9c28a28399d0"]},{"id":"n3v-x0118","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"敬語","r":"けいご","m":"kính ngữ","en":"honorific language","s":false,"ex":[["お客様と話すときは、正しい敬語を使わなければならない。","Khi nói chuyện với khách phải dùng kính ngữ cho đúng."]],"au":"t/333557f7a99d","eau":["t/3849fd692222"]},{"id":"n3v-x0119","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"言葉遣い","r":"ことばづかい","m":"cách ăn nói","en":"wording, language use","s":false,"ex":[["面接では、服装だけでなく言葉遣いにも気をつけよう。","Khi phỏng vấn, hãy chú ý không chỉ trang phục mà cả cách ăn nói."]],"au":"t/6e22d3aadc38","eau":["t/2cd37db1562d"]},{"id":"n3v-x0120","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"お世辞","r":"おせじ","m":"lời nịnh, lời khen xã giao","en":"flattery","s":false,"ex":[["「お上手ですね」と言われたが、たぶんお世辞だろう。","Tôi được khen \"Giỏi quá\", nhưng chắc chỉ là khen xã giao."]],"au":"t/1ca96f6e6ed4","eau":["t/e1a243ca8997"]},{"id":"n3v-x0121","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"謝罪","r":"しゃざい","m":"lời xin lỗi chính thức","en":"apology","s":true,"ex":[["社長が記者会見を開き、事故について正式に謝罪した。","Giám đốc mở họp báo và chính thức xin lỗi về vụ tai nạn."]],"au":"t/f90fb73a651e","eau":["t/fc5cfc6dfeb0"]},{"id":"n3v-x0122","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"お詫び","r":"おわび","m":"lời tạ lỗi","en":"apology (polite)","s":false,"ex":[["ご迷惑をおかけしたお詫びに、お菓子を持って伺いました。","Tôi mang chút bánh đến để tạ lỗi vì đã làm phiền."]],"au":"t/1b9f497f1fe0","eau":["t/fd43d7f36b4b"]},{"id":"n3v-x0123","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 1","l":7,"w":"お先に","r":"おさきに","m":"(xin phép) trước","en":"before (you)","s":false,"ex":[["仕事が終わったので、「お先に失礼します」と言って会社を出た。","Xong việc, tôi nói \"Tôi xin phép về trước\" rồi rời công ty."]],"au":"t/e5f61b1f94ac","eau":["t/e71ae808e215"]},{"id":"n3v-x0124","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"お疲れ様","r":"おつかれさま","m":"lời chào cảm ơn sự vất vả","en":"thanks for your hard work","s":false,"ex":[["会議のあと、部長に「お疲れ様でした」と声をかけた。","Sau cuộc họp, tôi chào trưởng phòng \"Anh vất vả rồi ạ\"."]],"au":"t/f735754fdaa1","eau":["t/a7da48e8c33a"]},{"id":"n3v-x0125","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"お邪魔する","r":"おじゃまする","m":"đến thăm, làm phiền (khiêm)","en":"visit (humble)","s":false,"ex":[["週末、先生のお宅にお邪魔することになっている。","Cuối tuần tôi sẽ đến thăm nhà thầy."]],"au":"t/55db969ed965","eau":["t/5c3616a88849"]},{"id":"n3v-x0126","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"気を遣う","r":"きをつかう","m":"để ý, giữ ý tứ","en":"be considerate","s":false,"ex":[["彼女はいつも周りの人に気を遣うので、疲れてしまうらしい。","Cô ấy luôn để ý tới người xung quanh nên hình như hay mệt."]],"au":"t/e86945645494","eau":["t/5e72cba8195b"]},{"id":"n3v-x0127","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"もてなす","r":"もてなす","m":"tiếp đãi","en":"entertain (guests)","s":false,"ex":[["遠くから来た友人を、手料理でもてなすことにした。","Tôi quyết định tiếp đãi người bạn ở xa đến bằng món tự nấu."]],"au":"t/50d3ebeedc1a","eau":["t/de456a663389"]},{"id":"n3v-x0128","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"おもてなし","r":"おもてなし","m":"lòng hiếu khách","en":"hospitality","s":false,"ex":[["この旅館は、心のこもったおもてなしで有名だ。","Lữ quán này nổi tiếng với sự hiếu khách chân thành."]],"au":"t/d74cf320f8e6","eau":["t/17e4ec0ef15e"]},{"id":"n3v-x0129","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"手土産","r":"てみやげ","m":"quà mang theo khi đến thăm","en":"gift brought on a visit","s":false,"ex":[["取引先を訪問するときは、手土産を持っていくことが多い。","Khi đến thăm đối tác, người ta thường mang theo quà."]],"au":"t/d8684b572ec1","eau":["t/66f21b6c167c"]},{"id":"n3v-x0130","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"お返し","r":"おかえし","m":"quà đáp lễ","en":"return gift","s":true,"ex":[["結婚祝いのお返しに、タオルのセットを送った。","Để đáp lễ quà mừng cưới, tôi gửi một bộ khăn."]],"au":"t/a3a260d5c94a","eau":["t/3f038ecd14d7"]},{"id":"n3v-x0131","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"差し上げる","r":"さしあげる","m":"biếu, tặng (khiêm)","en":"give (humble)","s":false,"ex":[["ご来店のお客様に、記念品を差し上げることになっております。","Chúng tôi xin biếu quà lưu niệm cho quý khách đến cửa hàng."]],"au":"t/be3aead5da3e","eau":["t/ca116033ab62"]},{"id":"n3v-x0132","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"申し上げる","r":"もうしあげる","m":"xin nói (khiêm)","en":"say (humble)","s":false,"ex":[["皆様に心からお礼を申し上げる次第です。","Tôi xin chân thành gửi lời cảm ơn đến quý vị."]],"au":"t/3d1d2ae967f0","eau":["t/aa46fe6237aa"]},{"id":"n3v-x0133","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"召し上がる","r":"めしあがる","m":"dùng, xơi (tôn kính)","en":"eat, drink (honorific)","s":false,"ex":[["このスープは、温かいうちに召し上がるのがいちばんおいしいですよ。","Món súp này dùng lúc còn nóng là ngon nhất đấy ạ."]],"au":"t/eb8afc018da6","eau":["t/08859a92e69b"]},{"id":"n3v-x0134","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"お目にかかる","r":"おめにかかる","m":"được gặp (khiêm)","en":"meet (humble)","s":false,"ex":[["社長に直接お目にかかるのは、今日が初めてです。","Hôm nay là lần đầu tiên tôi được gặp trực tiếp giám đốc."]],"au":"t/c9d78c043541","eau":["t/12879d1b88e6"]},{"id":"n3v-x0135","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"尊敬","r":"そんけい","m":"kính trọng, ngưỡng mộ","en":"respect, esteem","s":true,"ex":[["私が一番尊敬している人は、家族のために毎日働く父です。","Người tôi kính trọng nhất là bố, người ngày nào cũng làm việc vì gia đình."]],"au":"t/9385022bfb50","eau":["t/a3cb313ffdb2"]},{"id":"n3v-x0136","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"常識","r":"じょうしき","m":"lẽ thường, kiến thức phổ thông","en":"common sense","s":false,"ex":[["電車の中で大きな声で電話するのは、常識がないと思われる。","Nói điện thoại to trên tàu sẽ bị cho là thiếu hiểu biết lẽ thường."]],"au":"t/a88da09ce8b9","eau":["t/b02837fd5523"]},{"id":"n3v-x0137","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"態度","r":"たいど","m":"thái độ","en":"attitude","s":false,"ex":[["授業中の態度が悪いと、先生に注意された。","Tôi bị thầy nhắc nhở vì thái độ trong giờ học không tốt."]],"au":"t/74280e864b7d","eau":["t/3782a21ded34"]},{"id":"n3v-x0138","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"遠慮","r":"えんりょ","m":"khách sáo, ngại; kiềm chế (không làm)","en":"reserve, hesitation; refraining","s":true,"ex":[["体の具合が悪いので、今夜の飲み会は遠慮します。","Tôi không được khỏe nên xin phép không dự buổi nhậu tối nay."]],"au":"t/031fb60e3abf","eau":["t/ef92a782de5d"]},{"id":"n3v-x0139","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"迷惑","r":"めいわく","m":"phiền phức, làm phiền","en":"trouble, nuisance","s":true,"ex":[["電車が遅れて、お客様にご迷惑をおかけしました。","Tàu bị trễ đã gây phiền hà cho quý khách."]],"au":"t/df3d5ea61887","eau":["t/605d0370e36b"]},{"id":"n3v-x0140","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"許す","r":"ゆるす","m":"tha thứ; cho phép","en":"forgive; allow","s":false,"ex":[["子どもが夜遅く一人で出かけるのを許す親は少ない。","Ít bố mẹ nào cho phép con đi ra ngoài một mình lúc khuya."]],"au":"t/b74d729d7fa3","eau":["t/903b869bb9ea"]},{"id":"n3v-x0141","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"ungxu","tn":"Ứng xử & lễ nghi","tja":"礼儀・マナー","gl":"Ứng xử & lễ nghi 2","l":8,"w":"断る","r":"ことわる","m":"từ chối","en":"refuse, decline","s":false,"ex":[["給料が安かったので、その会社の仕事を断ることにした。","Lương thấp nên tôi quyết định từ chối công việc ở công ty đó."]],"au":"t/73279f9c937d","eau":["t/ebe7d025a07c"]},{"id":"n3v-x0142","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"話題","r":"わだい","m":"chủ đề câu chuyện","en":"topic","s":false,"ex":[["最近、職場ではその映画が話題になっている。","Dạo này ở chỗ làm, bộ phim đó đang được bàn tán."]],"au":"t/3a196e2bbf3c","eau":["t/94e9bc3b94f2"]},{"id":"n3v-x0143","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"話し合う","r":"はなしあう","m":"bàn bạc với nhau","en":"talk over","s":false,"ex":[["引っ越すかどうか、家族で話し合うことにした。","Cả nhà quyết định bàn với nhau xem có chuyển nhà hay không."]],"au":"t/18f686410a9c","eau":["t/583155e44580"]},{"id":"n3v-x0144","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"話し合い","r":"はなしあい","m":"cuộc bàn bạc","en":"discussion","s":false,"ex":[["三時間の話し合いの結果、やっと結論が出た。","Sau ba tiếng bàn bạc, cuối cùng cũng đi đến kết luận."]],"au":"t/f3d52c327771","eau":["t/5a6778630606"]},{"id":"n3v-x0145","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"おしゃべり","r":"おしゃべり","m":"chuyện phiếm; người lắm lời","en":"chat; chatterbox","s":true,"ex":[["喫茶店で友達と一時間もおしゃべりをした。","Tôi tán gẫu với bạn ở quán cà phê cả tiếng đồng hồ."]],"au":"t/671626714d1d","eau":["t/672d525701dd"]},{"id":"n3v-x0146","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"話しかける","r":"はなしかける","m":"bắt chuyện","en":"speak to","s":false,"ex":[["人見知りなので、パーティーで知らない人に自分から話しかけるのが苦手だ。","Tôi nhút nhát nên rất ngại tự bắt chuyện với người lạ ở bữa tiệc."]],"au":"t/4ab93400499e","eau":["t/ccee0622be39"]},{"id":"n3v-x0147","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"声をかける","r":"こえをかける","m":"gọi, hỏi han; rủ rê","en":"call out to","s":false,"ex":[["今度の飲み会には、新しく入った田中さんにも声をかけるつもりだ。","Tôi định rủ cả anh Tanaka mới vào công ty đi buổi nhậu lần tới."]],"au":"t/a27aa2502c9e","eau":["t/0560dac07f3f"]},{"id":"n3v-x0148","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"聞き取る","r":"ききとる","m":"nghe ra, nghe hiểu","en":"catch (by ear)","s":false,"ex":[["駅のアナウンスは早口で、聞き取るのが難しい。","Thông báo ở ga nói nhanh nên khó nghe ra."]],"au":"t/e14d6e029ff0","eau":["t/2daa08964ead"]},{"id":"n3v-x0149","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"聞き返す","r":"ききかえす","m":"hỏi lại","en":"ask again","s":false,"ex":[["わからないところは、遠慮せずに聞き返すようにしている。","Chỗ nào không hiểu, tôi không ngại hỏi lại."]],"au":"t/36ce07498196","eau":["t/58ffd6879bb6"]},{"id":"n3v-x0150","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"言い返す","r":"いいかえす","m":"cãi lại","en":"talk back","s":false,"ex":[["先生に注意されて言い返すなんて、失礼だよ。","Bị thầy nhắc mà cãi lại thì thật vô lễ."]],"au":"t/ca6e0873019b","eau":["t/38e32d24ef87"]},{"id":"n3v-x0151","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"言い出す","r":"いいだす","m":"nói ra (trước tiên)","en":"bring up, propose","s":false,"ex":[["誰が最初に言い出すか、みんな黙って様子を見ていた。","Mọi người im lặng chờ xem ai là người lên tiếng trước."]],"au":"t/923688d9c6a7","eau":["t/27719afad5a9"]},{"id":"n3v-x0152","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"打ち明ける","r":"うちあける","m":"thổ lộ, tâm sự","en":"confide","s":false,"ex":[["長い間の悩みを、親友に打ち明けることにした。","Tôi quyết định thổ lộ nỗi khổ tâm bấy lâu với bạn thân."]],"au":"t/506a9548b512","eau":["t/3f1551126933"]},{"id":"n3v-x0153","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"秘密","r":"ひみつ","m":"bí mật","en":"secret","s":false,"ex":[["これは二人だけの秘密だから、誰にも言わないでね。","Đây là bí mật của hai đứa mình, đừng nói với ai nhé."]],"au":"t/4a917640343e","eau":["t/9bd40a960bce"]},{"id":"n3v-x0154","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"うわさ","r":"うわさ","m":"tin đồn","en":"rumor","s":true,"ex":[["あの店が来月閉店するといううわさを聞いた。","Tôi nghe đồn cửa hàng đó sẽ đóng cửa vào tháng sau."]],"au":"t/15eaec69384e","eau":["t/7842683e0251"]},{"id":"n3v-x0155","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"嘘","r":"うそ","m":"lời nói dối","en":"lie","s":false,"ex":[["子どものころ、母に嘘をついてひどく叱られた。","Hồi nhỏ tôi nói dối mẹ và bị mắng một trận ra trò."]],"au":"t/b166be49ea2a","eau":["t/470bf3ff0d2f"]},{"id":"n3v-x0156","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"嘘つき","r":"うそつき","m":"kẻ nói dối","en":"liar","s":false,"ex":[["約束を何度も破るので、彼は嘘つきだと思われている。","Vì thất hứa nhiều lần nên anh ta bị coi là kẻ nói dối."]],"au":"t/5b6f25487f68","eau":["t/95388628eb2b"]},{"id":"n3v-x0157","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"ごまかす","r":"ごまかす","m":"lấp liếm, lừa lọc","en":"gloss over, cheat","s":false,"ex":[["失敗を笑ってごまかすのは、よくない。","Cười trừ để lấp liếm thất bại là không tốt."]],"au":"t/9e2f9f15a668","eau":["t/0f2260528bbe"]},{"id":"n3v-x0158","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"悪口","r":"わるくち","m":"lời nói xấu","en":"bad-mouthing","s":false,"ex":[["その場にいない人の悪口を言うのはやめよう。","Đừng nói xấu người không có mặt."]],"au":"t/b5ff95c435fb","eau":["t/2649bd64d3a8"]},{"id":"n3v-x0159","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"からかう","r":"からかう","m":"trêu chọc","en":"tease","s":false,"ex":[["妹をからかうと、すぐに泣いてしまう。","Hễ trêu em gái là nó khóc ngay."]],"au":"t/7b845e7f1249","eau":["t/0aeabd221b17"]},{"id":"n3v-x0160","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"文句","r":"もんく","m":"lời phàn nàn","en":"complaint","s":false,"ex":[["弟は夕飯のおかずにいつも文句を言う。","Em tôi lúc nào cũng phàn nàn về món ăn bữa tối."]],"au":"t/e9697cf25d68","eau":["t/54caa8bae372"]},{"id":"n3v-x0161","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"頼み","r":"たのみ","m":"lời nhờ vả","en":"request, favor","s":false,"ex":[["親友の頼みなので、断ることができなかった。","Vì là lời nhờ của bạn thân nên tôi không thể từ chối."]],"au":"t/0a465445dc58","eau":["t/97a567eb82f3"]},{"id":"n3v-x0162","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"怒鳴る","r":"どなる","m":"quát tháo","en":"shout, yell","s":false,"ex":[["父が大声で怒鳴るのを、生まれて初めて聞いた。","Lần đầu tiên trong đời tôi nghe bố quát to như thế."]],"au":"t/e2e28dd21016","eau":["t/995ee691498a"]},{"id":"n3v-x0163","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 1","l":9,"w":"ささやく","r":"ささやく","m":"thì thầm","en":"whisper","s":false,"ex":[["図書館では、ささやくような小さな声で話してください。","Trong thư viện xin hãy nói nhỏ như thì thầm."]],"au":"t/f278c9bcc666","eau":["t/8fc38edc64ee"]},{"id":"n3v-x0164","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"独り言","r":"ひとりごと","m":"nói một mình","en":"talking to oneself","s":false,"ex":[["祖父は最近、よく独り言を言っている。","Dạo này ông tôi hay nói một mình."]],"au":"t/b2a843060329","eau":["t/da0f3c96191f"]},{"id":"n3v-x0165","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"口癖","r":"くちぐせ","m":"câu cửa miệng","en":"pet phrase","s":false,"ex":[["「忙しい、忙しい」が部長の口癖だ。","\"Bận quá, bận quá\" là câu cửa miệng của trưởng phòng."]],"au":"t/afec2d727fbf","eau":["t/3775d023f414"]},{"id":"n3v-x0166","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"言い方","r":"いいかた","m":"cách nói","en":"way of saying","s":false,"ex":[["同じ内容でも、言い方によって相手の受け取り方が変わる。","Cùng một nội dung nhưng tùy cách nói mà người nghe tiếp nhận khác nhau."]],"au":"t/27b894af5893","eau":["t/4fdcd3ccf9b7"]},{"id":"n3v-x0167","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"表現","r":"ひょうげん","m":"sự diễn đạt","en":"expression","s":true,"ex":[["うれしい気持ちを言葉で表現するのは難しい。","Thật khó diễn đạt niềm vui bằng lời."]],"au":"t/ad9621e9c743","eau":["t/7b97fe90f27c"]},{"id":"n3v-x0168","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"ことわざ","r":"ことわざ","m":"tục ngữ","en":"proverb","s":false,"ex":[["「急がば回れ」ということわざを知っていますか。","Bạn có biết câu tục ngữ \"Dục tốc bất đạt\" không?"]],"au":"t/fc60cb01a06a","eau":["t/acfe4e75f1be"]},{"id":"n3v-x0169","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"方言","r":"ほうげん","m":"tiếng địa phương","en":"dialect","s":false,"ex":[["祖母の方言は難しくて、ときどき意味がわからない。","Tiếng địa phương của bà khó nên đôi khi tôi không hiểu."]],"au":"t/8cd6f6f3bbdd","eau":["t/df1de34e438b"]},{"id":"n3v-x0170","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"標準語","r":"ひょうじゅんご","m":"ngôn ngữ chuẩn","en":"standard language","s":false,"ex":[["ニュースのアナウンサーは標準語で話す。","Phát thanh viên tin tức nói bằng ngôn ngữ chuẩn."]],"au":"t/7c6bcbee922d","eau":["t/9c27bd679b49"]},{"id":"n3v-x0171","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"連絡","r":"れんらく","m":"liên lạc","en":"contact","s":true,"ex":[["駅に着いたら、すぐに連絡してください。","Đến ga thì hãy liên lạc với tôi ngay."]],"au":"t/c621ca74b05c","eau":["t/2d0d2e3e669f"]},{"id":"n3v-x0172","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"知らせる","r":"しらせる","m":"báo cho biết","en":"inform","s":false,"ex":[["会議の時間が変わったことを、みんなに知らせる必要がある。","Cần báo cho mọi người biết giờ họp đã thay đổi."]],"au":"t/6810a8322593","eau":["t/fb88ae59c10e"]},{"id":"n3v-x0173","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"知らせ","r":"しらせ","m":"tin báo","en":"news, notice","s":false,"ex":[["合格の知らせを聞いて、家族みんなで喜んだ。","Nghe tin đỗ, cả nhà đều vui mừng."]],"au":"t/526c51ec9772","eau":["t/04226a1f2fff"]},{"id":"n3v-x0174","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"メッセージ","r":"","m":"tin nhắn, thông điệp","en":"message","s":false,"ex":[["誕生日に、友達からたくさんのメッセージが届いた。","Vào sinh nhật, tôi nhận được rất nhiều tin nhắn từ bạn bè."]],"au":"t/6640e4a39293","eau":["t/b154670379b8"]},{"id":"n3v-x0175","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"アドバイス","r":"","m":"lời khuyên","en":"advice","s":true,"ex":[["先輩のアドバイスのおかげで、面接がうまくいった。","Nhờ lời khuyên của đàn anh mà buổi phỏng vấn suôn sẻ."]],"au":"t/2129038bf6d5","eau":["t/1f119a5b99fb"]},{"id":"n3v-x0176","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"スピーチ","r":"","m":"bài phát biểu","en":"speech","s":true,"ex":[["卒業式で、代表としてスピーチをすることになった。","Tôi được chọn làm đại diện phát biểu trong lễ tốt nghiệp."]],"au":"t/645c3f570fc2","eau":["t/747aa3552026"]},{"id":"n3v-x0177","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"コミュニケーション","r":"","m":"sự giao tiếp","en":"communication","s":false,"ex":[["外国人の同僚とのコミュニケーションには、まだ苦労している。","Tôi vẫn còn chật vật trong việc giao tiếp với đồng nghiệp nước ngoài."]],"au":"t/ed3a14b28341","eau":["t/238f097b322b"]},{"id":"n3v-x0178","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"黙る","r":"だまる","m":"im lặng, nín","en":"be silent","s":false,"ex":[["都合が悪くなるとすぐ黙るのは、彼の悪い癖だ。","Hễ gặp chuyện bất lợi là im bặt, đó là tật xấu của anh ta."]],"au":"t/2cbd3e7ace19","eau":["t/7fedf772946e"]},{"id":"n3v-x0179","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"賛成","r":"さんせい","m":"tán thành","en":"agreement","s":true,"ex":[["父は私の留学に賛成してくれたが、母は反対した。","Bố tán thành việc tôi đi du học, còn mẹ thì phản đối."]],"au":"t/ed3f13ab6ef8","eau":["t/b8a937445b3b"]},{"id":"n3v-x0180","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"褒める","r":"ほめる","m":"khen ngợi","en":"praise","s":false,"ex":[["祖母は会うたびに私の料理を褒めるので、うれしくなる。","Lần nào gặp bà cũng khen món tôi nấu nên tôi thấy vui."]],"au":"t/88809a51e9f9","eau":["t/1e7c211fd53d"]},{"id":"n3v-x0181","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"叱る","r":"しかる","m":"mắng, la rầy","en":"to scold","s":false,"ex":[["部長は部下を叱るとき、いつも会議室に呼ぶ。","Trưởng phòng mỗi lần mắng cấp dưới đều gọi vào phòng họp."]],"au":"t/2794769950de","eau":["t/1cf16f6cae5a"]},{"id":"n3v-x0182","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"苦情","r":"くじょう","m":"phàn nàn, khiếu nại","en":"complaint","s":false,"ex":[["お客様からの苦情の電話に対応するのも、店長の仕事だ。","Xử lý các cuộc gọi khiếu nại của khách cũng là việc của cửa hàng trưởng."]],"au":"t/cc52fa748507","eau":["t/db5b7654f45d"]},{"id":"n3v-x0183","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"冗談","r":"じょうだん","m":"lời nói đùa","en":"joke","s":false,"ex":[["彼はまじめな顔で冗談を言うので、本気かどうか分からない。","Anh ấy nói đùa với vẻ mặt nghiêm túc nên chẳng biết thật hay đùa."]],"au":"t/1349b74986f8","eau":["t/06dce224decf"]},{"id":"n3v-x0184","set":"nguoi","dn":"Con người & quan hệ","dja":"人・人間関係","tp":"loinoi","tn":"Lời nói & trao đổi","tja":"言葉・やりとり","gl":"Lời nói & trao đổi 2","l":10,"w":"言い訳","r":"いいわけ","m":"lời bào chữa, ngụy biện","en":"excuse","s":true,"ex":[["宿題を忘れた言い訳に、弟は「犬が食べた」と言った。","Để bào chữa cho việc quên bài tập, em trai tôi nói \"con chó ăn mất rồi\"."]],"au":"t/c23f7a10aa57","eau":["t/a9f187ccb29e"]},{"id":"n3v-x0185","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"誠実","r":"せいじつ","m":"thành thật, chân thành","en":"sincere","s":false,"ex":[["彼は誠実な人なので、一度した約束は必ず守る。","Anh ấy là người chân thành nên lời hứa nào cũng giữ."]],"au":"t/2da8aeb47bbe","eau":["t/4e36d43949c4"]},{"id":"n3v-x0186","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"正直者","r":"しょうじきもの","m":"người thật thà","en":"honest person","s":false,"ex":[["拾った財布を交番に届けるなんて、彼は本当に正直者だ。","Mang ví nhặt được đến đồn cảnh sát, anh ấy thật là người thật thà."]],"au":"t/93bacd7620e2","eau":["t/12c93e57b40f"]},{"id":"n3v-x0187","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"しっかり","r":"しっかり","m":"chững chạc, đáng tin","en":"steady, reliable","s":true,"ex":[["姉はしっかりしているので、両親も安心している。","Chị tôi chững chạc nên bố mẹ cũng yên tâm."]],"au":"t/a9176c6eea95","eau":["t/6bae969b8192"]},{"id":"n3v-x0188","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"几帳面","r":"きちょうめん","m":"ngăn nắp, tỉ mỉ","en":"meticulous","s":false,"ex":[["父は几帳面で、机の上はいつもきれいに片付いている。","Bố tôi rất ngăn nắp, mặt bàn lúc nào cũng gọn gàng."]],"au":"t/0f2453546376","eau":["t/7829a42914b8"]},{"id":"n3v-x0189","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"落ち着き","r":"おちつき","m":"sự điềm tĩnh","en":"composure","s":false,"ex":[["彼女は若いのに落ち着きがあって、どんなときも慌てない。","Cô ấy còn trẻ mà điềm tĩnh, lúc nào cũng không cuống."]],"au":"t/955df829dc9e","eau":["t/ebacc22bc98c"]},{"id":"n3v-x0190","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"気が長い","r":"きがながい","m":"kiên nhẫn, không nóng vội","en":"patient","s":false,"ex":[["何度同じことを聞かれても怒らないなんて、先生は気が長い。","Bị hỏi cùng một điều bao nhiêu lần mà không giận, thầy thật kiên nhẫn."]],"au":"t/ba6530db0f15","eau":["t/7ac29fa6e813"]},{"id":"n3v-x0191","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"我慢強い","r":"がまんづよい","m":"giỏi chịu đựng","en":"patient, enduring","s":false,"ex":[["けがをしても泣かないなんて、あの子は我慢強い。","Bị thương mà không khóc, đứa bé đó chịu đựng giỏi thật."]],"au":"t/18b40a1dbb18","eau":["t/d7c8acd868f6"]},{"id":"n3v-x0192","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"責任感","r":"せきにんかん","m":"tinh thần trách nhiệm","en":"sense of responsibility","s":false,"ex":[["彼は責任感が強いので、仕事を途中で投げ出したりしない。","Anh ấy có tinh thần trách nhiệm cao nên không bỏ dở công việc."]],"au":"t/40584295359a","eau":["t/fa1aa2bb2889"]},{"id":"n3v-x0193","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"正義感","r":"せいぎかん","m":"lòng chính nghĩa","en":"sense of justice","s":false,"ex":[["正義感の強い彼女は、いじめを見て黙っていられなかった。","Cô ấy giàu lòng chính nghĩa nên không thể im lặng khi thấy bắt nạt."]],"au":"t/ad819566e3d2","eau":["t/2f18cd5cdf31"]},{"id":"n3v-x0194","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"思いやり","r":"おもいやり","m":"lòng quan tâm, thấu hiểu","en":"consideration, compassion","s":false,"ex":[["相手の気持ちを考える思いやりを持ってほしい。","Mong em có lòng quan tâm, biết nghĩ cho cảm xúc người khác."]],"au":"t/bc94d8cd3cfe","eau":["t/716f063ebf7d"]},{"id":"n3v-x0195","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"優しさ","r":"やさしさ","m":"sự tử tế, dịu dàng","en":"kindness","s":false,"ex":[["困ったときに助けてくれた彼の優しさは忘れられない。","Tôi không quên được sự tử tế của anh ấy khi giúp tôi lúc khó khăn."]],"au":"t/6b0e0033ed17","eau":["t/76fc8bf9f228"]},{"id":"n3v-x0196","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"気が利く","r":"きがきく","m":"nhanh ý, chu đáo","en":"thoughtful, attentive","s":false,"ex":[["彼女は気が利くので、言われる前にお茶を出してくれる。","Cô ấy nhanh ý nên mời trà trước cả khi được nhờ."]],"au":"t/55bbe8b0fcfe","eau":["t/580c2f12a1bd"]},{"id":"n3v-x0197","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"頼りになる","r":"たよりになる","m":"đáng tin cậy, chỗ dựa","en":"dependable","s":false,"ex":[["困ったときに頼りになるのは、やはり家族だ。","Lúc khó khăn, chỗ dựa vẫn là gia đình."]],"au":"t/417b77c313e0","eau":["t/f9cb55392f49"]},{"id":"n3v-x0198","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"気前がいい","r":"きまえがいい","m":"hào phóng","en":"generous","s":false,"ex":[["部長は気前がいいので、よく部下にごちそうしてくれる。","Trưởng phòng hào phóng nên hay khao cấp dưới."]],"au":"t/9aa49fe46ba8","eau":["t/b7078e568601"]},{"id":"n3v-x0199","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"親しみやすい","r":"したしみやすい","m":"dễ gần","en":"approachable","s":false,"ex":[["新しい先生は笑顔が多くて、親しみやすい人だ。","Thầy mới hay cười, là người dễ gần."]],"au":"t/201b7fc0653f","eau":["t/ac3a5277eae8"]},{"id":"n3v-x0200","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 1","l":1,"w":"ユーモア","r":"","m":"óc hài hước","en":"humor","s":false,"ex":[["彼の話にはユーモアがあって、いつも周りを笑わせる。","Chuyện anh ấy kể rất hài hước, luôn làm mọi người cười."]],"au":"t/4df86edf37f1","eau":["t/e69f0213f5b3"]},{"id":"n3v-x0201","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 2","l":2,"w":"ユニーク","r":"","m":"độc đáo","en":"unique","s":false,"ex":[["彼女はいつもユニークなアイデアを出して、みんなを驚かせる。","Cô ấy luôn đưa ra ý tưởng độc đáo khiến mọi người bất ngờ."]],"au":"t/8836b03f7921","eau":["t/53c993415f6e"]},{"id":"n3v-x0202","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 2","l":2,"w":"個性的","r":"こせいてき","m":"có cá tính riêng","en":"distinctive","s":false,"ex":[["この学校の制服は、色もデザインも個性的だ。","Đồng phục trường này cả màu lẫn kiểu dáng đều rất riêng."]],"au":"t/293bc190035c","eau":["t/8c457f77b9c3"]},{"id":"n3v-x0203","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"tinhcach_tot","tn":"Tính cách tích cực","tja":"長所・人柄","gl":"Tính cách tích cực 2","l":2,"w":"マイペース","r":"","m":"theo nhịp độ riêng","en":"at one's own pac urage","s":false,"ex":[["川に落ちた子どもを助けた少年の勇気が、新聞で紹介された。","Lòng dũng cảm của cậu thiếu niên cứu đứa trẻ rơi xuống sông được báo chí giới thiệu."]],"au":"t/34a7c1f68720","eau":["t/e2e06c28a275"]},{"id":"n3v-x0349","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"ychi","tn":"Ý chí & nỗ lực","tja":"意志・努力","gl":"Ý chí & nỗ lực 2","l":10,"w":"諦める","r":"あきらめる","m":"từ bỏ, bỏ cuộc","en":"give up","s":false,"ex":[["一度失敗したくらいで夢を諦めるのは早すぎる。","Mới thất bại một lần mà từ bỏ ước mơ thì còn quá sớm."]],"au":"t/02a9bdec12b2","eau":["t/7a7f7b3849dd"]},{"id":"n3v-x0350","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"考え方","r":"かんがえかた","m":"cách nghĩ","en":"way of thinking","s":false,"ex":[["海外で暮らして、ものの考え方が大きく変わった。","Sống ở nước ngoài, cách nghĩ của tôi thay đổi nhiều."]],"au":"t/766ec83fa1a3","eau":["t/03d345433e3a"]},{"id":"n3v-x0351","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"考え事","r":"かんがえごと","m":"điều đang nghĩ ngợi","en":"something on one's mind","s":false,"ex":[["考え事をしながら歩いていて、駅を通り過ぎてしまった。","Mải nghĩ ngợi khi đi bộ, tôi đi quá cả ga."]],"au":"t/cc1154c42d93","eau":["t/845a19e614e4"]},{"id":"n3v-x0352","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"考え直す","r":"かんがえなおす","m":"suy nghĩ lại","en":"reconsider","s":false,"ex":[["会社を辞めるのは、もう一度考え直すことにした。","Tôi quyết định suy nghĩ lại chuyện nghỉ việc."]],"au":"t/9f84deb8dbe5","eau":["t/3f73192610d9"]},{"id":"n3v-x0353","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"アイデア","r":"","m":"ý tưởng","en":"idea","s":false,"ex":[["会議で出たアイデアの中から、一つを選んで進めることになった。","Từ các ý tưởng đưa ra trong cuộc họp, chúng tôi chọn một cái để triển khai."]],"au":"t/73575c649a80","eau":["t/898724b3354d"]},{"id":"n3v-x0354","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"思いつく","r":"おもいつく","m":"nảy ra (ý)","en":"think of, hit upon","s":false,"ex":[["シャワーを浴びているときに、いい案を思いつくことが多い。","Tôi hay nảy ra ý hay khi đang tắm."]],"au":"t/11cef58fd915","eau":["t/30cdd6116e42"]},{"id":"n3v-x0355","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"思い浮かぶ","r":"おもいうかぶ","m":"hiện lên trong đầu","en":"come to mind","s":false,"ex":[["目を閉じると、故郷の海の景色が思い浮かぶ。","Nhắm mắt lại là cảnh biển quê nhà hiện lên trong đầu."]],"au":"t/1f1c3e16725b","eau":["t/0a3893beb66a"]},{"id":"n3v-x0356","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"思い出","r":"おもいで","m":"kỷ niệm","en":"memory (recollection)","s":false,"ex":[["この写真を見ると、高校時代の楽しい思い出がよみがえる。","Nhìn tấm ảnh này, kỷ niệm vui thời cấp ba lại ùa về."]],"au":"t/1a1f8b916094","eau":["t/16031a704683"]},{"id":"n3v-x0357","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"思い込む","r":"おもいこむ","m":"đinh ninh, tin chắc","en":"be convinced (wrongly)","s":false,"ex":[["自分だけが正しいと思い込むのは危険だ。","Đinh ninh chỉ mình mình đúng là nguy hiểm."]],"au":"t/f755e028ffe6","eau":["t/925ba63f8976"]},{"id":"n3v-x0358","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"思い込み","r":"おもいこみ","m":"sự ngộ nhận","en":"assumption, preconception","s":false,"ex":[["「女性は機械に弱い」というのは、ただの思い込みだ。","\"Phụ nữ kém về máy móc\" chỉ là ngộ nhận."]],"au":"t/50630e36c759","eau":["t/df984ce0492e"]},{"id":"n3v-x0359","set":"kokoro","dn":"T ng, lo nghĩ","en":"worry about, mind","s":false,"ex":[["人の目を気にする必要はないよ。自分の好きな服を着ればいい。","Không cần để ý ánh mắt người khác đâu. Cứ mặc đồ mình thích là được."]],"au":"t/67c59b3479d6","eau":["t/1f9752836662"]},{"id":"n3v-x0365","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"迷う","r":"まよう","m":"phân vân, lạc","en":"hesitate; get lost","s":false,"ex":[["どちらを選ぶか迷うときは、先輩に相談するといい。","Khi phân vân chọn cái nào, nên hỏi ý đàn anh."]],"au":"t/77094038483a","eau":["t/cb42a969bd53"]},{"id":"n3v-x0366","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"選択","r":"せんたく","m":"sự lựa chọn","en":"choice","s":true,"ex":[["大学を辞めて働くという選択は、間違っていなかったと思う。","Tôi nghĩ lựa chọn bỏ đại học đi làm không sai."]],"au":"t/131cca8a7a63","eau":["t/27f655d348d2"]},{"id":"n3v-x0367","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"区別","r":"くべつ","m":"phân biệt","en":"distinction","s":true,"ex":[["あの双子は、私には区別がつかない。","Tôi không phân biệt được cặp sinh đôi đó."]],"au":"t/11fac5fb79d6","eau":["t/c79b81b2cb1e"]},{"id":"n3v-x0368","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"見分ける","r":"みわける","m":"nhận biết, phân biệt (bằng mắt)","en":"tell apart","s":false,"ex":[["本物と偽物を見分けるのは、専門家でも難しい。","Phân biệt đồ thật đồ giả, chuyên gia cũng thấy khó."]],"au":"t/d1e9f7fc9fb2","eau":["t/15c3dc4dd193"]},{"id":"n3v-x0369","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"反対","r":"はんたい","m":"phản đối; ngược lại","en":"opposition; opposite","s":true,"ex":[["両親は、私の留学に反対している。","Bố mẹ phản đối chuyện tôi đi du học."]],"au":"t/25c71c617749","eau":["t/a79ebaae858f"]},{"id":"n3v-x0370","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"確か","r":"たしか","m":"chắc chắn; hình như","en":"certain; if I remember right","s":false,"ex":[["確か、会議は三時からだったと思う。","Hình như cuộc họp bắt đầu lúc ba giờ thì phải."]],"au":"t/4fa8cbb22da4","eau":["t/9c6461fa4215"]},{"id":"n3v-x0371","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 1","l":11,"w":"当然","r":"とうぜん","m":"đương nhiên","en":"natural, of course","s":false,"ex":[["約束を何度も破れば、当然、信用をなくすことになる。","Thất hứa nhiều lần thì đương nhiên sẽ mất lòng tin."]],"au":"t/b27a5bd6be34","eau":["t/e2cc194bb56c"]},{"id":"n3v-x0372","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 2","l":12,"w":"当たり前","r":"あたりまえ","m":"lẽ thường, hiển nhiên","en":"obvious, normal","s":false,"ex":[["今ではスマホで買い物をするのが当たり前になった。","Giờ đây mua sắm bằng điện thoại đã thành chuyện bình thường."]],"au":"t/ccd55069f601","eau":["t/3c00c0fe8e5d"]},{"id":"n3v-x0373","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 2","l":12,"w":"不思議","r":"ふしぎ","m":"kỳ lạ, khó giải thích","en":"strange, mysterious","s":false,"ex":[["あんなに練習したのに、今日はなぜか失敗ばかりで不思議だ。","Tập nhiều thế mà hôm nay toàn hỏng, thật lạ."]],"au":"t/13e99496f626","eau":["t/18b8e55f4f30"]},{"id":"n3v-x0374","set":"kokoro","dn":"Tâm lý & tính cách","dja":"心・性格","tp":"suynghi","tn":"Suy nghĩ & nhận thức","tja":"思考・判断","gl":"Suy nghĩ & nhận thức 2","l":12,"w":"謎","r":"なぞ","m":"điều bí ẩn","en":"mystery, riddle","s":false,"ex":[["彼がなぜ急にいなくなったのかは、今も謎のままだ。","Vì sao anh ấy đột nhiên biến mất đến giờ vẫn là điều bí ẩn."]],"au":"t/6bc828b6e79b","eau":["t/2b5556e8bab6"]},{"id":"n3v-x0375","set":"ko 859a80d539"]},{"id":"n3v-x1696","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"上下","r":"じょうげ","m":"trên dưới","en":"up and down","s":false,"ex":[["このボタンを押すと、画面が上下に動く。","Nhấn nút này thì màn hình di chuyển lên xuống."]],"au":"t/bef513c6d214","eau":["t/b350a1639ec7"]},{"id":"n3v-x1697","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"向かい","r":"むかい","m":"đối diện","en":"opposite, across","s":false,"ex":[["郵便局は、銀行の向かいにあります。","Bưu điện nằm đối diện ngân hàng."]],"au":"t/ac04c7cf518f","eau":["t/972beb9cb736"]},{"id":"n3v-x1698","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"途端","r":"とたん","m":"ngay khi, vừa mới","en":"just as, the moment","s":false,"ex":[["社長が部屋に入ってきた途端、みんな静かになった。","Giám đốc vừa bước vào phòng là mọi người im bặt."]],"au":"t/516164687e8d","eau":["t/a2bea31eeb31"]},{"id":"n3v-x1699","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"直前","r":"ちょくぜん","m":"ngay trước khi","en":"just before","s":false,"ex":[["試験の直前になって、慌てて勉強を始めた。","Ngay sát kỳ thi tôi mới cuống cuồng bắt đầu học."]],"au":"t/85445df2ebb7","eau":["t/5dd131e863c1"]},{"id":"n3v-x1700","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"事前","r":"じぜん","m":"trước (khi việc gì diễn ra)","en":"beforehand, in advance","s":false,"ex":[["会議の資料は、事前に読んでおいてください。","Tài liệu cuộc họp, hãy đọc trước nhé."]],"au":"t/0f96679e94ee","eau":["t/5c50d79b97b6"]},{"id":"n3v-x1701","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"将来","r":"しょうらい","m":"tương lai, sau này (của bản thân)","en":"future","s":false,"ex":[["子どもたちの将来のために、きれいな地球を残したい。","Vì tương lai của con trẻ, tôi muốn để lại một Trái Đất trong lành."]],"au":"t/9d201c071aa4","eau":["t/568a6cbfe6a7"]},{"id":"n3v-x1702","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"平日","r":"へいじつ","m":"ngày thường","en":"weekday","s":false,"ex":[["平日は仕事が忙しいので、買い物は週末にしている。","Ngày thường bận việc nên tôi đi mua sắm vào cuối tuần."]],"au":"t/96c8165dc293","eau":["t/44b7527f3204"]},{"id":"n3v-x1703","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"期限","r":"きげん","m":"thời hạn","en":"deadline, time limit","s":false,"ex":[["図書館の本の返却期限は、二週間です。","Thời hạn trả sách thư viện là hai tuần."]],"au":"t/0b18c07c0cb0","eau":["t/3f02107bd4a2"]},{"id":"n3v-x1704","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"締め切り","r":"しめきり","m":"hạn chót","en":"deadline","s":false,"ex":[["作家は、いつも締め切りに追われている。","Nhà văn lúc nào cũng bị hạn chót đuổi theo."]],"au":"t/4f24148a2799","eau":["t/64f264ba5669"]},{"id":"n3v-x1705","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"延長","r":"えんちょう","m":"kéo dài, gia hạn","en":"extension","s":true,"ex":[["店の営業時間が、夜十一時まで延長された。","Giờ mở cửa của cửa hàng được kéo dài đến 11 giờ đêm."]],"au":"t/c0aed257adbf","eau":["t/9b30d2f44266"]},{"id":"n3v-x1706","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"thoigian","tn":"Thời gian & vị trí","tja":"時間・空間","gl":"Thời gian & vị trí 3","l":8,"w":"距離","r":"きょり","m":"cự ly, khoảng cách","en":"distance","s":false,"ex":[["富士山までの距離は遠いが、晴れた日はここからでも見える。","Khoảng cách đến núi Phú Sĩ xa nhưng ngày trời quang vẫn nhìn thấy được từ đây."]],"au":"t/6c8ee12377a4","eau":["t/e7b03e1a91c8"]},{"id":"n3v-x1707","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"変化","r":"へんか","m":"sự thay đổi","en":"change","s":true,"ex":[["この十年で、町の様子が大きく変化した。","Trong mười năm qua, diện mạo thị trấn đã thay đổi rất nhiều."]],"au":"t/8c84f4882cac","eau":["t/8cc0213345b1"]},{"id":"n3v-x1708","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"増減","r":"ぞうげん","m":"tăng giảm","en":"increase and decrease","s":true,"ex":[["季節によって、店の客の数が増減する。","Tùy theo mùa mà lượng khách của cửa hàng tăng giảm."]],"au":"t/c6b9e590c912","eau":["t/e563990e38b5"]},{"id":"n3v-x1709","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"増やす","r":"ふやす","m":"làm tăng, tăng thêm","en":"to increase (something)","s":false,"ex":[["日本語の力をつけるため、毎日読む量を増やすことにした。","Để giỏi tiếng Nhật, tôi quyết định tăng lượng đọc mỗi ngày."]],"au":"t/e6337cbbcc2d","eau":["t/3f85663437bc"]},{"id":"n3v-x1710","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"上昇","r":"じょうしょう","m":"(nhiệt độ, giá cả) tăng lên","en":"rise","s":true,"ex":[["今年は気温が上昇して、記録的な暑さになった。","Năm nay nhiệt độ tăng cao, nóng kỷ lục."]],"au":"t/6c73d5cf8a9d","eau":["t/f1e0e620c5f7"]},{"id":"n3v-x1711","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"伸びる","r":"のびる","m":"dài ra; tăng trưởng","en":"to grow, extend","s":false,"ex":[["子どもの背が伸びるのは本当に早くて、服がすぐ小さくなる。","Trẻ con cao lên thật nhanh, quần áo chẳng mấy chốc đã chật."]],"au":"t/ae53fea7175f","eau":["t/600fec26c8cf"]},{"id":"n3v-x1712","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"縮める","r":"ちぢめる","m":"rút ngắn, thu nhỏ","en":"to shorten, shrink","s":false,"ex":[["練習を重ねて、タイムを五秒縮めることができた。","Nhờ luyện tập nhiều, tôi rút ngắn được thành tích năm giây."]],"au":"t/c060649ab7b9","eau":["t/94e117060327"]},{"id":"n3v-x1713","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"縮小","r":"しゅくしょう","m":"thu nhỏ, thu hẹp","en":"reduction, downsizing","s":true,"ex":[["この地図を縮小してコピーしてください。","Hãy thu nhỏ bản đồ này rồi photo giúp tôi."]],"au":"t/4d30f61d9607","eau":["t/5eb8c8d85822"]},{"id":"n3v-x1714","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"広がる","r":"ひろがる","m":"lan rộng, mở rộng ra","en":"to spread, widen","s":false,"ex":[["窓を開けると、目の前に青い海が広がる。","Mở cửa sổ ra là biển xanh trải rộng trước mắt."]],"au":"t/ae7306cfe6cd","eau":["t/2365f44ddebe"]},{"id":"n3v-x1715","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"広げる","r":"ひろげる","m":"mở rộng, trải ra","en":"to spread out, expand","s":false,"ex":[["テーブルの上に地図を広げると、みんなが集まってきた。","Vừa trải bản đồ lên bàn là mọi người xúm lại."]],"au":"t/dd15ed8a0e97","eau":["t/2a6c9411abf2"]},{"id":"n3v-x1716","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"広まる","r":"ひろまる","m":"lan truyền, phổ biến rộng","en":"to spread (widely)","s":false,"ex":[["悪い噂ほど、あっという間に広まるものだ。","Tin đồn xấu thì lại càng lan nhanh trong chớp mắt."]],"au":"t/c7efcd2d6d65","eau":["t/12237ebfe936"]},{"id":"n3v-x1717","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"深まる","r":"ふかまる","m":"sâu sắc thêm","en":"to deepen","s":false,"ex":[["一緒に旅行をすると、友達との仲が深まることが多い。","Đi du lịch cùng nhau thì tình bạn thường trở nên thân thiết hơn."]],"au":"t/dad52a0af385","eau":["t/18ce56ea3534"]},{"id":"n3v-x1718","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"高まる","r":"たかまる","m":"(cảm xúc, mức độ) dâng cao","en":"to rise, heighten","s":false,"ex":[["大会が近づくにつれて、選手たちの緊張が高まる。","Giải đấu càng đến gần, sự căng thẳng của các tuyển thủ càng dâng cao."]],"au":"t/66421ac83dca","eau":["t/ba0fd643ca64"]},{"id":"n3v-x1719","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"高める","r":"たかめる","m":"nâng cao","en":"to raise, enhance","s":false,"ex":[["サービスの質を高めるために、社員の研修を増やした。","Để nâng cao chất lượng dịch vụ, chúng tôi tăng đào tạo nhân viên."]],"au":"t/fd4a836c0ce6","eau":["t/8ccc8c7da50a"]},{"id":"n3v-x1720","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"強まる","r":"つよまる","m":"mạnh lên","en":"to strengthen","s":false,"ex":[["夜になると、雨と風がさらに強まるそうだ。","Nghe nói về đêm mưa gió sẽ càng mạnh hơn."]],"au":"t/1a5726a4bf8b","eau":["t/a5edc67c4b3f"]},{"id":"n3v-x1721","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"弱まる","r":"よわまる","m":"yếu đi","en":"to weaken","s":false,"ex":[["台風の勢いが弱まるまで、外に出ないでください。","Đến khi sức bão yếu đi, xin đừng ra ngoài."]],"au":"t/22e09854b96c","eau":["t/d39c8e1f5139"]},{"id":"n3v-x1722","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 1","l":9,"w":"加わる","r":"くわわる","m":"được thêm vào; tham gia","en":"to be added; to join","s":false,"ex":[["来月から、新しいメンバーが二人チームに加わる予定だ。","Từ tháng sau dự kiến sẽ có hai thành viên mới tham gia vào nhóm."]],"au":"t/0c4c4485220e","eau":["t/9210fd24366b"]},{"id":"n3v-x1723","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"消える","r":"きえる","m":"biến mất; tắt","en":"to disappear; go out","s":false,"ex":[["このペンで書いた字は、熱を当てると消える。","Chữ viết bằng chiếc bút này sẽ biến mất khi gặp nhiệt."]],"au":"t/1cf92d0c1113","eau":["t/13e8513106a8"]},{"id":"n3v-x1724","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"繰り返す","r":"くりかえす","m":"lặp lại","en":"to repeat","s":false,"ex":[["同じ失敗を繰り返すことがないように、メモをとっておこう。","Hãy ghi chú lại để không lặp lại cùng một thất bại."]],"au":"t/696961a9c386","eau":["t/30a88269100a"]},{"id":"n3v-x1725","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"重なる","r":"かさなる","m":"chồng lên; trùng nhau","en":"to overlap; coincide","s":false,"ex":[["今年は祝日が日曜日と重なるので、月曜日が休みになる。","Năm nay ngày lễ trùng vào Chủ nhật nên thứ Hai được nghỉ bù."]],"au":"t/feed58b940c9","eau":["t/4ec6f1f50740"]},{"id":"n3v-x1726","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"混ざる","r":"まざる","m":"bị trộn lẫn","en":"to be mixed","s":false,"ex":[["水と油は、いくら振っても混ざることがない。","Nước và dầu lắc thế nào cũng không hòa lẫn vào nhau."]],"au":"t/274ab7147f66","eau":["t/dc4beaf3224c"]},{"id":"n3v-x1727","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"固まる","r":"かたまる","m":"đông cứng lại","en":"to harden, set","s":false,"ex":[["ゼリーは冷蔵庫に二時間入れておくと固まる。","Thạch để trong tủ lạnh hai tiếng là đông lại."]],"au":"t/f74893b1301b","eau":["t/aa5d53397e07"]},{"id":"n3v-x1728","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"増加","r":"ぞうか","m":"gia tăng","en":"increase","s":true,"ex":[["一人で暮らすお年寄りの数が、増加している。","Số người già sống một mình đang gia tăng."]],"au":"t/c42cac500372","eau":["t/f040e5494a37"]},{"id":"n3v-x1729","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"減少","r":"げんしょう","m":"giảm, suy giảm","en":"decrease","s":true,"ex":[["子どもの数が減少して、小学校が一つなくなった。","Số trẻ em giảm khiến một trường tiểu học phải đóng cửa."]],"au":"t/d7aff935fac4","eau":["t/ea038ddb899d"]},{"id":"n3v-x1730","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"減らす","r":"へらす","m":"làm giảm, cắt giảm","en":"to reduce","s":false,"ex":[["健康のために、お酒の量を減らすことにした。","Vì sức khỏe, tôi quyết định giảm lượng rượu."]],"au":"t/4df4b2a567c1","eau":["t/3ff9565274df"]},{"id":"n3v-x1731","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"低下","r":"ていか","m":"suy giảm, giảm sút","en":"decline, drop","s":true,"ex":[["年を取ると、記憶力が低下する。","Có tuổi thì trí nhớ giảm sút."]],"au":"t/0e2a1fda7be8","eau":["t/a17cab51169f"]},{"id":"n3v-x1732","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & tăng giảm","tja":"変化・増減","gl":"Biến đổi & tăng giảm 2","l":10,"w":"変更","r":"へんこう","m":"thay đổi","en":"change, alteration","s":true,"ex":[["パスワードは、三か月に一回変更してください。","Hãy đổi mật khẩu ba tháng một lần."]],"au":"t/b61e7024cfa1","eau":["t/215de7c882d8"]},{"id":"n3v-x1733","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"biendoi","tn":"Biến đổi & àn toàn","en":"complete, perfect","s":false,"ex":[["けがが完全に治るまで、運動はしないでください。","Đến khi vết thương lành hoàn toàn, xin đừng vận động."]],"au":"t/a83b5926d219","eau":["t/3cbfcf9d2373"]},{"id":"n3v-x1739","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"danhgia","tn":"Tính chất & đánh giá","tja":"性質・評価","gl":"Tính chất & đánh giá 1","l":11,"w":"完璧","r":"かんぺき","m":"hoàn hảo","en":"flawless","s":false,"ex":[["何度も練習したので、スピーチは完璧だった。","Luyện tập nhiều lần nên bài phát biểu hoàn hảo."]],"au":"t/ecbd4f007cbe","eau":["t/429e39d327e2"]},{"id":"n3v-x1740","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"danhgia","tn":"Tính chất & đánh giá","tja":"性質・評価","gl":"Tính chất & đánh giá 1","l":11,"w":"十分","r":"じゅうぶん","m":"đủ, đầy đủ","en":"enough, sufficient","s":false,"ex":[["時間は十分あるから、急がなくても大丈夫だ。","Thời gian còn đủ nên không cần vội đâu."]],"au":"t/2379c2fbf1c6","eau":["t/1ff3faff64ea"]},{"id":"n3v-x1741","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"danhgia","tn":"Tính chất & đánh giá","tja":"性質・評価","gl":"Tính chất & đánh giá 1","l":11,"w":"不十分","r":"ふじゅうぶん","m":"chưa đủ","en":"insufficient","s":false,"ex":[["準備が不十分なまま試合に出て、負けてしまった。","Ra thi đấu khi chuẩn bị chưa đủ nên đã thua."]],"au":"t/37b3a6c22e02","eau":["t/14049e44b6d4"]},{"id":"n3v-x1742","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"danhgia","tn":"Tính chất & đánh giá","tja":"性質・評価","gl":"Tính chất & đánh giá 1","l":11,"w":"可能","r":"かのう","m":"có thể, khả thi","en":"possible","s":false,"ex":[["このホテルは、ペットと一緒に泊まることも可能なので、犬を連れて行った。","Khách sạn này cho phép ở cùng thú cưng nên tôi dẫn chó theo."]],"au":"t/12749c5647c9","eau":["t/c82ff33936b4"]},{"id":"n3v-x1743","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"danhgia","tn":"Tính chất & đánh giá","tja":"性質・評価","gl":"Tính chất & đánh giá 1","l":11,"w":"不可能","r":"ふかのう","m":"không thể","en":"impossible","s":false,"ex":[["彼の世界記録を破るのは、ほぼ不可能に近いと言われている。","Người ta nói phá kỷ lục thế giới của anh ấy gần như là không thể."] :"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"ずいぶん","r":"ずいぶん","m":"khá là, đáng kể (ngoài dự đoán)","en":"quite, considerably","s":false,"ex":[["「ずいぶん久しぶりだね。元気だった?」と、昔の友達が声をかけてきた。","\"Lâu lắm rồi nhỉ. Khỏe không?\" — người bạn cũ cất tiếng gọi tôi."]],"au":"t/de5f05ddda59","eau":["t/9c8e354f3fdd"]},{"id":"n3v-x1782","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"すっかり","r":"すっかり","m":"hoàn toàn, hẳn","en":"completely","s":false,"ex":[["本に夢中になっていたら、外はすっかり暗くなっていた。","Mải mê đọc sách, lúc nhận ra thì bên ngoài đã tối hẳn."]],"au":"t/efcf5d800e76","eau":["t/891c283a778a"]},{"id":"n3v-x1783","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"まったく","r":"まったく","m":"hoàn toàn (không); thật là","en":"entirely; (not) at all","s":false,"ex":[["まったく、あの人はいつも約束の時間に遅れてくるんだから。","Thật là, người đó lúc nào cũng đến trễ giờ hẹn."]],"au":"t/3a7887b95918","eau":["t/f25796696956"]},{"id":"n3v-x1784","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"ほとんど","r":"ほとんど","m":"hầu hết; hầu như (không)","en":"almost, mostly","s":false,"ex":[["宿題はほとんど終わったが、あと一問だけ残っている。","Bài tập gần như đã xong, chỉ còn lại đúng một câu."]],"au":"t/591b71735d6c","eau":["t/944f9e469f28"]},{"id":"n3v-x1785","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"結構","r":"けっこう","m":"khá là; (từ chối) đủ rồi, không cần","en":"fairly, quite; no thank you","s":false,"ex":[["「お茶をもう一杯いかがですか。」「いえ、もう結構です。」","\"Anh dùng thêm một chén trà nhé?\" \"Dạ thôi, đủ rồi ạ.\""]],"au":"t/7092d41991b5","eau":["t/6839f883196c"]},{"id":"n3v-x1786","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"なかなか","r":"なかなか","m":"mãi mà (không); khá là","en":"(not) easily; quite","s":false,"ex":[["バスがなかなか来ないので、駅まで歩くことにした。","Xe buýt mãi không tới nên tôi quyết định đi bộ ra ga."]],"au":"t/9740390efa26","eau":["t/606cc1233a0d"]},{"id":"n3v-x1787","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"多少","r":"たしょう","m":"ít nhiều, đôi chút","en":"somewhat, a little","s":false,"ex":[["日本語は多少話せますが、読むのはまだ苦手です。","Tiếng Nhật tôi nói được đôi chút, nhưng đọc thì còn kém."]],"au":"t/1cdcc8ce74f9","eau":["t/5adca1146998"]},{"id":"n3v-x1788","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"少々","r":"しょうしょう","m":"một chút (lịch sự)","en":"a little, a moment","s":false,"ex":[["担当の者を呼びますので、少々お待ちください。","Tôi sẽ gọi người phụ trách, xin quý khách đợi một chút."]],"au":"t/3a60d462ba9b","eau":["t/0e34cec21d70"]},{"id":"n3v-x1789","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"それほど","r":"それほど","m":"đến mức đó (không)","en":"(not) that much","s":false,"ex":[["天気予報では寒いと言っていたが、それほどでもなかった。","Dự báo thời tiết nói trời lạnh, nhưng không đến mức đó."]],"au":"t/d5aaa3477192","eau":["t/1817b26c91c9"]},{"id":"n3v-x1790","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"あまりにも","r":"あまりにも","m":"quá mức, quá đỗi","en":"too much, excessively","s":false,"ex":[["あまりにも疲れていて、服のまま寝てしまった。","Mệt quá đỗi nên tôi ngủ thiếp đi mà chưa thay đồ."]],"au":"t/8a6c82c27bf6","eau":["t/76fa3eb770de"]},{"id":"n3v-x1791","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"たった","r":"たった","m":"chỉ vỏn vẹn","en":"only, merely","s":false,"ex":[["あの店では、たった百円でコーヒーが飲める。","Ở quán đó chỉ với vỏn vẹn một trăm yên là uống được cà phê."]],"au":"t/0e2b59cd7d1d","eau":["t/be38e7f4b9f5"]},{"id":"n3v-x1792","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"さらに","r":"さらに","m":"hơn nữa, càng thêm","en":"further, even more","s":false,"ex":[["駅から歩いて十分、さらにバスに乗って五分かかる。","Từ ga đi bộ mười phút, rồi còn đi xe buýt thêm năm phút nữa."]],"au":"t/f06f2c77cc9a","eau":["t/81ac9acd2b1b"]},{"id":"n3v-x1793","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"ますます","r":"ますます","m":"ngày càng","en":"more and more","s":false,"ex":[["日本語の勉強が、ますますおもしろくなってきた。","Việc học tiếng Nhật ngày càng trở nên thú vị."]],"au":"t/99c4dbe07f77","eau":["t/ead844bb607d"]},{"id":"n3v-x1794","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 1","l":13,"w":"より","r":"より","m":"hơn (nữa)","en":"more, -er","s":false,"ex":[["より多くの人に知ってもらうため、ポスターを作った。","Để nhiều người hơn biết đến, chúng tôi làm áp phích."]],"au":"t/93cbe1a63be8","eau":["t/7a79372c6f23"]},{"id":"n3v-x1795","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"何より","r":"なにより","m":"hơn hết, quý nhất","en":"above all","s":false,"ex":[["お金も大切だが、何より健康がいちばんだ。","Tiền cũng quan trọng, nhưng hơn hết là sức khỏe."]],"au":"t/5e56a7c38938","eau":["t/77c0e0b1a127"]},{"id":"n3v-x1796","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"できるだけ","r":"できるだけ","m":"càng... càng tốt, hết mức có thể","en":"as much as possible","s":false,"ex":[["明日は大切な試験なので、できるだけ早く寝よう。","Mai thi quan trọng nên hãy cố đi ngủ sớm nhất có thể."]],"au":"t/955bf41a9b53","eau":["t/f5043a4dd069"]},{"id":"n3v-x1797","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"必ずしも","r":"かならずしも","m":"không hẳn, không nhất thiết","en":"not necessarily","s":false,"ex":[["値段が高いものが、必ずしもいいものだとは限らない。","Đồ đắt tiền không nhất thiết là đồ tốt."]],"au":"t/94b478f9b5c0","eau":["t/96d67b786d12"]},{"id":"n3v-x1798","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"少しずつ","r":"すこしずつ","m":"từng chút một","en":"little by little","s":false,"ex":[["リハビリを続けて、少しずつ歩けるようになった。","Tiếp tục tập phục hồi, tôi đã dần đi lại được từng chút một."]],"au":"t/c9580f3d0f9d","eau":["t/5f184485d3c4"]},{"id":"n3v-x1799","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"ほんの少し","r":"ほんのすこし","m":"chỉ một chút xíu","en":"just a little","s":false,"ex":[["ほんの少しですが、お礼の気持ちです。どうぞ受け取ってください。","Chỉ là chút quà nhỏ thể hiện lòng biết ơn, xin anh nhận cho."]],"au":"t/7ed191fdd0f6","eau":["t/b80c21707595"]},{"id":"n3v-x1800","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"非常に","r":"ひじょうに","m":"cực kỳ, rất","en":"extremely","s":false,"ex":[["今年の夏は、非常に暑かった。","Mùa hè năm nay nóng vô cùng."]],"au":"t/19a551e7bb76","eau":["t/0f354cf61594"]},{"id":"n3v-x1801","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"実に","r":"じつに","m":"thực sự, quả thật","en":"truly, really","s":false,"ex":[["あの山から見た朝日は、実に美しかった。","Cảnh mặt trời mọc nhìn từ ngọn núi đó quả thật tuyệt đẹp."]],"au":"t/aad3bc103ea2","eau":["t/fb323e384335"]},{"id":"n3v-x1802","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"大いに","r":"おおいに","m":"rất, nhiều","en":"greatly, very much","s":false,"ex":[["この経験は、将来の仕事に大いに役立つだろう。","Trải nghiệm này chắc chắn sẽ rất có ích cho công việc sau này."]],"au":"t/8e5efcf010f3","eau":["t/9935994f4c39"]},{"id":"n3v-x1803","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"最も","r":"もっとも","m":"nhất","en":"most","s":false,"ex":[["一年で最も寒いのは、一月か二月だ。","Lạnh nhất trong năm là tháng Một hoặc tháng Hai."]],"au":"t/fed41efd93a4","eau":["t/ccd22a15dc55"]},{"id":"n3v-x1804","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"主に","r":"おもに","m":"chủ yếu","en":"mainly","s":false,"ex":[["この地方では、主に米と野菜を作っている。","Vùng này chủ yếu trồng lúa và rau."]],"au":"t/2660c7b746d7","eau":["t/4c4993121683"]},{"id":"n3v-x1805","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"およそ","r":"およそ","m":"khoảng, xấp xỉ","en":"about, approximately","s":false,"ex":[["この町の人口は、およそ五万人だ。","Dân số thị trấn này khoảng năm vạn người."]],"au":"t/77f998ab0268","eau":["t/66a1fc6468a4"]},{"id":"n3v-x1806","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"せめて","r":"せめて","m":"ít nhất, tối thiểu","en":"at least","s":false,"ex":[["忙しくても、せめて朝ご飯だけは食べなさい。","Dù bận cũng ít nhất phải ăn bữa sáng."]],"au":"t/a825c5380910","eau":["t/97ac9cafd10f"]},{"id":"n3v-x1807","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_mucdo","tn":"Phó từ mức độ","tja":"程度の副詞","gl":"Phó từ mức độ 2","l":14,"w":"少なくとも","r":"すくなくとも","m":"ít nhất","en":"at least","s":false,"ex":[["駅まで歩くと、少なくとも二十分はかかる。","Đi bộ đến ga ít nhất cũng mất hai mươi phút."]],"au":"t/e5966be4b065","eau":["t/2b453f6fc51f"]},{"id":"n3v-x1808","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 1","l":15,"w":"すでに","r":"すでに","m":"đã (rồi)","en":"already","s":false,"ex":[["会場に着いたときには、すでに会議が始まっていた。","Lúc tôi đến hội trường thì cuộc họp đã bắt đầu rồi."]],"au":"t/09423344f25b","eau":["t/92a0274e7a09"]},{"id":"n3v-x1809","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 1","l":15,"w":"これまで","r":"これまで","m":"cho đến nay","en":"until now","s":false,"ex":[["これまで一度も海外に行ったことがない。","Cho đến nay tôi chưa từng đi nước ngoài lần nào."]],"au":"t/3ce8ba4a6df2","eau":["t/2f2ed6110507"]},{"id":"n3v-x1810","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 1","l":15,"w":"未だに","r":"いまだに","m":"đến giờ vẫn còn","en":"still, even now","s":false,"ex":[["十年前の事件の犯人は、未だに見つかっていない。","Hung thủ vụ án mười năm trước đến giờ vẫn chưa tìm ra."]],"au":"t/00b84ea4c51a","eau":["t/47888cdf6950"]},{"id":"n3v-x1811","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 1","l":15,"w":"以来","r":"いらい","m":"kể từ khi","en":"since","s":false,"ex":[["日本に来て以来、毎日自分で料理を作っている。","Kể từ khi đến Nhật, ngày nào tôi cũng tự nấu ăn."]],"au":"t/fe96783ca5a7","eau":["t/3832dab76f0e"]},{"id":"n3v-x1812","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 1","l":15,"w":"その後","r":"そのご","m":"sau đó","en":"after that","s":false,"ex":[["彼とは卒業式で会ったが、その後一度も連絡がない。","Tôi gặp anh ấy ở lễ tốt nghiệp, nhưng sau đó chẳng liên lạc lần nào."]],"au":"t/b237e0108fd2","eau":["t/0e6fbaf61426"]},{"id":"n3v-x1813","set":"kotoba","dn":"Khái niệm & phó từ","dja":"概念・副詞","tp":"pt_thoigian","tn":"Phó từ thời gian","tja":"時・頻度の副詞","gl":"Phó từ thời gian 1","l":15,"w":"後に","r":"のちに","m":"về sau (trong truyện, lịch sử)","en":"late
